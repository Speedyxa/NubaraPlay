<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canales TV - NubaraPlay</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #141414; color: #fff; min-height: 100vh; overflow-x: hidden; }
        
        .navbar { position: fixed; top: 0; width: 100%; padding: 20px 4%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 10%, transparent); transition: background 0.4s; }
        .navbar.scrolled { background: #141414; }
        .navbar-left { display: flex; align-items: center; gap: 25px; }
        .logo { color: #e50914; font-size: 28px; font-weight: bold; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: #e5e5e5; text-decoration: none; font-size: 14px; transition: color 0.4s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; font-weight: bold; }
        .navbar-right { display: flex; align-items: center; gap: 20px; }
        .user-info { background: #e50914; padding: 5px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .logout-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 7px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: rgba(255,255,255,0.1); }

        .hero-section { position: relative; height: 50vh; min-height: 400px; background: url('https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat; display: flex; align-items: flex-end; padding: 0 4% 40px; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #141414 5%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.2) 100%); }
        .hero-content { position: relative; z-index: 10; max-width: 700px; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(229, 9, 20, 0.2); border: 1px solid #e50914; color: #e50914; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .hero-title { font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 15px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .hero-desc { font-size: 16px; color: #a3a3a3; line-height: 1.6; margin-bottom: 25px; max-width: 500px; }

        .agenda-section { padding: 40px 4%; background: linear-gradient(to bottom, #141414, #1a1a1a); border-top: 1px solid #333; border-bottom: 1px solid #333; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .section-title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .agenda-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: thin; scrollbar-color: #e50914 transparent; }
        .agenda-card { flex: 0 0 300px; background: #181818; border: 1px solid #333; border-radius: 12px; padding: 20px; transition: all 0.3s; cursor: pointer; }
        .agenda-card:hover { border-color: #e50914; transform: translateY(-3px); background: rgba(229, 9, 20, 0.05); }
        .agenda-time { color: #e50914; font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .agenda-match { font-size: 18px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .agenda-channel { font-size: 13px; color: #808080; display: flex; align-items: center; gap: 6px; }

        .content-section { padding: 40px 4%; }
        .categoria-section { margin-bottom: 60px; }
        .categoria-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .categoria-icon { font-size: 22px; }
        .categoria-title { font-size: 20px; font-weight: 700; color: #fff; }
        .categoria-count { color: #808080; font-size: 14px; margin-left: auto; }
        .grid-canales { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

        .card { background: #181818; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s; position: relative; border: 1px solid #222; }
        .card:hover { transform: scale(1.05); z-index: 100; border-color: #e50914; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .card-img-container { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; background: #000; padding: 15px; }
        .card img { width: 100%; height: 100%; object-fit: contain; }
        .card-name { padding: 14px 12px; text-align: center; font-size: 14px; font-weight: 600; color: #fff; background: #181818; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card:hover .card-name { color: #e50914; }
        .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; opacity: 0; transition: all 0.3s; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .card:hover .fav-btn { opacity: 1; }
        .fav-btn.active { color: #ffd700; opacity: 1; background: rgba(0,0,0,0.8); }

        #modalCanal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px; }
        #modalCanal.activo { display: flex; }
        .modal-box { background: #181818; border-radius: 16px; width: 100%; max-width: 1100px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.8); border: 1px solid #333; }
        .modal-top { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; background: #000; border-bottom: 1px solid #333; }
        .modal-top h3 { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .modal-close { background: #181818; border: 1px solid #333; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .modal-close:hover { background: #e50914; border-color: #e50914; }
        .modal-video { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
        .modal-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

        .loading, .no-results { text-align: center; padding: 80px 20px; color: #808080; font-size: 18px; }

        @media (max-width: 768px) {
            .hero-title { font-size: 32px; }
            .grid-canales { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .nav-links { display: none; }
            .fav-btn { opacity: 1; }
            .agenda-card { flex: 0 0 260px; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo">NUBARAPLAY</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="ver-canales.html" class="active">Canales TV</a></li>
                <li><a href="genero.html">Películas</a></li>
            </ul>
        </div>
        <div class="navbar-right">
            <span class="user-info" id="userInfo">Usuario</span>
            <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
        </div>
    </nav>

    <div class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-badge">🔴 En Vivo Ahora</div>
            <h1 class="hero-title">Deportes y Entretenimiento Sin Límites</h1>
            <p class="hero-desc">Accede a la mejor programación en vivo. Fútbol, noticias, cine y mucho más.</p>
        </div>
    </div>

    <div class="agenda-section" id="agenda">
        <div class="section-header">
            <h2 class="section-title"> Agenda Deportiva Destacada</h2>
        </div>
        <div class="agenda-scroll" id="agendaContainer">
            <div class="loading" style="padding: 20px;">Cargando agenda...</div>
        </div>
    </div>

    <div class="content-section" id="contenido">
        <div class="loading">Cargando catálogo de canales...</div>
    </div>

    <div id="modalCanal" onclick="cerrarModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-top">
                <h3><span style="color: #e50914;">●</span> <span id="modalTitulo">En Vivo</span></h3>
                <button class="modal-close" onclick="cerrarModal()">✕</button>
            </div>
            <div class="modal-video">
                <iframe id="modalIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const savedUser = localStorage.getItem('nubaraPlayUser');
        if (!savedUser) { window.location.href = 'index.html'; } 
        else { document.getElementById('userInfo').textContent = JSON.parse(savedUser).tipo === 'demo' ? 'DEMO' : 'PREMIUM'; }

        function cerrarSesion() { localStorage.removeItem('nubaraPlayUser'); localStorage.removeItem('nubaraPlayUserExpiry'); window.location.href = 'index.html'; }

        const firebaseConfig = {
            apiKey: "AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",
            authDomain: "nubaraplay.firebaseapp.com",
            projectId: "nubaraplay",
            storageBucket: "nubaraplay.firebasestorage.app",
            messagingSenderId: "873822057409",
            appId: "1:873822057409:web:f854a974f457eedd0c7540"
        };
        
        try { firebase.initializeApp(firebaseConfig); } catch (e) { console.log("Firebase ya inicializado"); }
        const db = firebase.firestore();

        window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50));
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarModal(); });

        const iconosCat = { 'Deportes': '⚽', 'Noticias': '📰', 'Entretenimiento': '📺', 'Musica': '🎵', 'Infantil': '🧸', 'Default': '📡' };

        db.collection("agenda").orderBy("horaRaw", "asc").onSnapshot((snapshot) => {
            const container = document.getElementById('agendaContainer');
            if (snapshot.empty) { 
                container.innerHTML = '<div style="padding: 20px; color: #888;">No hay eventos programados hoy.</div>'; 
            } else {
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const ev = doc.data();
                    const card = document.createElement('div');
                    card.className = 'agenda-card';
                    card.innerHTML = '<div class="agenda-time">🕒 ' + ev.hora + '</div><div class="agenda-match">' + ev.nombre + '</div><div class="agenda-channel">📺 ' + ev.canal + '</div>';
                    card.onclick = function() { abrirModal({ nombre: ev.nombre, url: ev.url, id: doc.id }); };
                    container.appendChild(card);
                });
            }
        });

        db.collection("canales").onSnapshot((snapshot) => {
            const contenido = document.getElementById('contenido');
            if (snapshot.empty) { contenido.innerHTML = '<div class="no-results">No hay canales disponibles</div>'; return; }

            const categoriasMap = {};
            snapshot.forEach((doc) => {
                const canal = doc.data();
                if (canal.categoria === 'Peliculas') return; 
                const cat = canal.categoria || 'Default';
                if (!categoriasMap[cat]) categoriasMap[cat] = [];
                categoriasMap[cat].push({ id: doc.id, ...canal });
            });

            contenido.innerHTML = '';
            Object.keys(categoriasMap).sort().forEach(categoria => {
                const canales = categoriasMap[categoria];
                const icono = iconosCat[categoria] || '📡';
                
                const section = document.createElement('div');
                section.className = 'categoria-section';
                section.innerHTML = '<div class="categoria-header"><span class="categoria-icon">' + icono + '</span><h2 class="categoria-title">' + categoria + '</h2><span class="categoria-count">' + canales.length + ' canales</span></div><div class="grid-canales" id="grid-' + categoria.replace(/\s+/g, '') + '"></div>';
                contenido.appendChild(section);

                const grid = section.querySelector('.grid-canales');
                canales.forEach(canal => {
                    const favoritos = JSON.parse(localStorage.getItem('nubaraPlayFavoritos') || '[]');
                    const esFav = favoritos.includes(canal.id);
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = '<div class="card-img-container"><img src="' + canal.logo + '" alt="' + canal.nombre + '" loading="lazy" onerror="this.src=\'https://via.placeholder.com/200x120/181818/808080?text=TV\'"></div><div class="card-name">' + canal.nombre + '</div><button class="fav-btn ' + (esFav ? 'active' : '') + '" onclick="toggleFavorito(\'' + canal.id + '\', event)">' + (esFav ? '★' : '☆') + '</button>';
                    card.onclick = function(e) { if (!e.target.classList.contains('fav-btn')) abrirModal(canal); };
                    grid.appendChild(card);
                });
            });
        });

        // ✅ FUNCIÓN MODIFICADA: Registra visualización con usuario
        function abrirModal(canal) {
            document.getElementById('modalTitulo').textContent = canal.nombre;
            document.getElementById('modalIframe').src = canal.url;
            document.getElementById('modalCanal').classList.add('activo');
            document.body.style.overflow = 'hidden';
            
            // Sumar visita al canal
            if(canal.id) db.collection("canales").doc(canal.id).update({ visitas: (canal.visitas || 0) + 1 }).catch(() => {});
            
            // ✅ REGISTRAR VISUALIZACIÓN CON USUARIO
            const usuario = JSON.parse(localStorage.getItem('nubaraPlayUser') || '{}');
            db.collection("visualizaciones").add({
                usuarioId: usuario.id || 'anonimo',
                usuarioNombre: usuario.nombre || 'Anónimo',
                tipo: 'canal',
                contenidoId: canal.id,
                nombre: canal.nombre,
                categoria: canal.categoria || 'General',
                fecha: new Date()
            }).catch((err) => console.log("Error registrando visualización:", err));
        }

        function cerrarModal(e) {
            if (e && e.target !== e.currentTarget && e.type === 'click') return;
            document.getElementById('modalCanal').classList.remove('activo');
            document.getElementById('modalIframe').src = '';
            document.body.style.overflow = 'auto';
        }

        function toggleFavorito(id, event) {
            event.stopPropagation();
            let favoritos = JSON.parse(localStorage.getItem('nubaraPlayFavoritos') || '[]');
            const index = favoritos.indexOf(id);
            if (index > -1) favoritos.splice(index, 1); else favoritos.push(id);
            localStorage.setItem('nubaraPlayFavoritos', JSON.stringify(favoritos));
            const btn = event.target.closest('.fav-btn');
            if (index > -1) { btn.classList.remove('active'); btn.innerHTML = '☆'; } 
            else { btn.classList.add('active'); btn.innerHTML = '★'; }
        }
    </script>
</body>
</html>
