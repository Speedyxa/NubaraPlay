<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios - NubaraPlay</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <style>
    .codigo-box { background: #1a1a1e; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 1.5em; color: #e50914; text-align: center; margin: 10px 0; letter-spacing: 3px; font-weight: bold; }
    .tipo-final { color: #28a745; font-weight: bold; }
    .tipo-demo { color: #ffc107; font-weight: bold; }
    .expirado { color: #dc3545; font-weight: bold; }
    .activo { color: #28a745; font-weight: bold; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <a href="#" class="navbar-brand"><span class="brand-text font-weight-bold">📺 NubaraPlay</span></a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Web</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="cerrarSesionAdmin()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="admin.html" class="brand-link"><span class="brand-text font-weight-light">Panel Admin</span></a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="admin.html" class="nav-link"><i class="nav-icon fas fa-chart-line"></i><p>Dashboard</p></a></li>
          <li class="nav-item"><a href="canales.html" class="nav-link"><i class="nav-icon fas fa-tv"></i><p>Canales TV</p></a></li>
          <li class="nav-item"><a href="peliculas.html" class="nav-link"><i class="nav-icon fas fa-film"></i><p>Películas TMDB</p></a></li>
          <li class="nav-item"><a href="usuarios.html" class="nav-link active"><i class="nav-icon fas fa-users"></i><p>Usuarios</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><h1 class="m-0">👥 Gestión de Usuarios</h1></div></div>
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-4">
            <div class="card card-success">
              <div class="card-header"><h3 class="card-title">➕ Crear Usuario</h3></div>
              <div class="card-body">
                <div class="form-group"><label>Nombre</label><input type="text" id="userName" class="form-control" placeholder="Ej: Juan Pérez"></div>
                <div class="form-group"><label>Email (opcional)</label><input type="email" id="userEmail" class="form-control" placeholder="correo@ejemplo.com"></div>
                <div class="form-group"><label>Tipo</label>
                  <select id="userTipo" class="form-control" onchange="document.getElementById('duracionGroup').style.display = this.value === 'demo' ? 'none' : 'block'">
                    <option value="final">👤 Usuario Final</option>
                    <option value="demo">🎬 Demo (1 hora)</option>
                  </select>
                </div>
                <div class="form-group" id="duracionGroup"><label>Duración</label>
                  <select id="userDuration" class="form-control">
                    <option value="1">1 Mes</option><option value="3">3 Meses</option>
                    <option value="6">6 Meses</option><option value="12">12 Meses</option>
                  </select>
                </div>
                <button onclick="crearUsuario()" class="btn btn-success btn-block"><i class="fas fa-user-plus"></i> Generar Código</button>
              </div>
            </div>
            <div id="codigoGenerado" class="card card-warning" style="display: none;">
              <div class="card-body text-center">
                <p>Código de acceso:</p>
                <div class="codigo-box" id="codigoTexto"></div>
                <button onclick="navigator.clipboard.writeText(document.getElementById('codigoTexto').textContent); Swal.fire('¡Copiado!', '', 'success')" class="btn btn-primary btn-sm"><i class="fas fa-copy"></i> Copiar</button>
              </div>
            </div>
          </div>
          <div class="col-md-8">
            <div class="card card-info">
              <div class="card-header"><h3 class="card-title">Usuarios Registrados</h3></div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead><tr><th>Nombre</th><th>Código</th><th>Tipo</th><th>Expira</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody id="tablaUsuarios"><tr><td colspan="6" class="text-center">Cargando...</td></tr></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<script>
  verificarAdmin();

  function generarCodigo() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let codigo = '';
    for (let i = 0; i < 5; i++) codigo += chars.charAt(Math.floor(Math.random() * chars.length));
    return codigo;
  }

  async function crearUsuario() {
    const nombre = document.getElementById('userName').value;
    if (!nombre) return Swal.fire('Error', 'El nombre es obligatorio', 'error');
    
    const tipo = document.getElementById('userTipo').value;
    const duracion = parseInt(document.getElementById('userDuration').value);
    const fechaExpiracion = new Date();
    
    if (tipo === 'demo') fechaExpiracion.setHours(fechaExpiracion.getHours() + 1);
    else fechaExpiracion.setMonth(fechaExpiracion.getMonth() + duracion);

    const userData = {
      nombre, email: document.getElementById('userEmail').value,
      codigo: generarCodigo(), tipo, fechaExpiracion,
      duracionMeses: tipo === 'demo' ? 0 : duracion
    };

    await db.collection("usuarios").add(userData);
    document.getElementById('codigoTexto').textContent = userData.codigo;
    document.getElementById('codigoGenerado').style.display = 'block';
    Swal.fire('¡Creado!', `Código: ${userData.codigo}`, 'success');
    document.getElementById('userName').value = '';
    document.getElementById('userEmail').value = '';
  }

  function cargarUsuarios() {
    db.collection("usuarios").onSnapshot((snapshot) => {
      const tbody = document.getElementById('tablaUsuarios');
      tbody.innerHTML = '';
      const ahora = new Date();
      
      snapshot.forEach((doc) => {
        const user = doc.data();
        const fechaExp = convertirFecha(user.fechaExpiracion);
        const expirado = fechaExp < ahora;
        const fechaFormateada = fechaExp.toLocaleString('es-ES', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        const tipoBadge = user.tipo === 'demo' ? '<span class="tipo-demo">🎬 Demo</span>' : '<span class="tipo-final">👤 Final</span>';
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${user.nombre}</strong></td>
          <td><code style="background:#1a1a1e; padding:3px 8px; border-radius:3px; letter-spacing:2px;">${user.codigo}</code></td>
          <td>${tipoBadge}</td>
          <td>${fechaFormateada}</td>
          <td>${expirado ? '<span class="expirado">❌ Expirado</span>' : '<span class="activo">✅ Activo</span>'}</td>
          <td><button class="btn btn-sm btn-danger" onclick="db.collection('usuarios').doc('${doc.id}').delete()"><i class="fas fa-trash"></i></button></td>`;
        tbody.appendChild(tr);
      });
    });
  }

  cargarUsuarios();
</script>
</body>
</html>
