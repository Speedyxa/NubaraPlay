<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Películas - Admin NubaraPlay</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <style>
    .tmdb-results { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; margin-top: 5px; display: none; background: #fff; }
    .tmdb-item { padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; }
    .tmdb-item:hover { background: #f0f0f0; }
    .tmdb-item img { width: 50px; height: 75px; object-fit: cover; border-radius: 3px; }
    .movie-preview { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #ddd; }
    .movie-preview img { max-width: 200px; border-radius: 8px; display: block; margin: 0 auto; }
    .movie-preview h4 { color:#e50914; margin: 15px 0 10px; text-align: center; }
    .generos-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; justify-content: center; }
    .genero-tag { background: #e50914; padding: 4px 10px; border-radius: 12px; font-size: 0.8em; color: #fff; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <a href="#" class="navbar-brand"><span class="brand-text font-weight-bold">📺 NubaraPlay</span></a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Web</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="cerrarSesionAdmin()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="admin.html" class="brand-link"><span class="brand-text font-weight-light">Panel Admin</span></a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="admin.html" class="nav-link"><i class="nav-icon fas fa-chart-line"></i><p>Dashboard</p></a></li>
          <li class="nav-item"><a href="canales.html" class="nav-link"><i class="nav-icon fas fa-tv"></i><p>Canales TV</p></a></li>
          <li class="nav-item"><a href="peliculas.html" class="nav-link active"><i class="nav-icon fas fa-film"></i><p>Películas TMDB</p></a></li>
          <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="nav-icon fas fa-users"></i><p>Usuarios</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><h1 class="m-0">🎬 Gestión de Películas (TMDB)</h1></div></div>
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-5">
            <div class="card card-warning">
              <div class="card-header"><h3 class="card-title">➕ Agregar Película</h3></div>
              <div class="card-body">
                <input type="hidden" id="peliculaId">
                <div class="form-group">
                  <label><i class="fas fa-search"></i> Buscar en TMDB</label>
                  <input type="text" id="tmdbSearch" class="form-control" placeholder="Ej: Avatar, Batman..." oninput="buscarTMDB()">
                  <div class="tmdb-results" id="tmdbResults"></div>
                </div>
                <div class="movie-preview" id="moviePreview">
                  <img id="previewPoster" src="" alt="Poster">
                  <h4 id="previewTitle"></h4>
                  <p id="previewOverview"></p>
                  <div class="generos-tags" id="previewGeneros"></div>
                </div>
                <input type="hidden" id="peliculaNombre">
                <input type="hidden" id="peliculaPoster">
                <input type="hidden" id="peliculaAnio">
                <input type="hidden" id="peliculaSinopsis">
                <input type="hidden" id="peliculaRating">
                <input type="hidden" id="peliculaGeneros">
                <div class="form-group" style="margin-top: 15px;">
                  <label><i class="fas fa-link"></i> URL del Stream</label>
                  <input type="text" id="peliculaUrl" class="form-control" placeholder="https://vimeos.net/embed-xxxxx.htm">
                </div>
                <button onclick="guardarPelicula()" class="btn btn-success btn-block"><i class="fas fa-save"></i> Guardar</button>
                <button onclick="limpiarPelicula()" class="btn btn-secondary btn-block mt-2"><i class="fas fa-times"></i> Limpiar</button>
              </div>
            </div>
          </div>
          <div class="col-md-7">
            <div class="card card-info">
              <div class="card-header"><h3 class="card-title">Películas Agregadas</h3></div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead><tr><th>Póster</th><th>Título</th><th>Géneros</th><th>Año</th><th>Acciones</th></tr></thead>
                    <tbody id="tablaPeliculas"><tr><td colspan="5" class="text-center">Cargando...</td></tr></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<script>
  // Verificar admin
  if (localStorage.getItem('nubaraPlayAdmin') !== 'true') {
    window.location.href = 'login.html';
  }

  // ⚠️ YA ESTÁN DECLARADAS EN config.js, NO las redeclaramos aquí:
  // TMDB_API_KEY
  // TMDB_IMAGE_URL
  
  let peliculasLocales = [];
  let searchTimeout;

  // Test de conexión al cargar
  window.addEventListener('load', () => {
    console.log("Página cargada, probando TMDB...");
    fetch(`https://api.themoviedb.org/3/configuration?api_key=${TMDB_API_KEY}`)
      .then(r => r.json())
      .then(data => {
        if (data.status_code) {
          console.error("TMDB Error:", data.status_message);
        } else {
          console.log("✅ TMDB conectado correctamente");
        }
      })
      .catch(err => {
        console.error("❌ Error de conexión:", err);
      });
  });

  function buscarTMDB() {
    clearTimeout(searchTimeout);
    const query = document.getElementById('tmdbSearch').value.trim();
    
    if (query.length < 2) { 
      document.getElementById('tmdbResults').style.display = 'none'; 
      return; 
    }
    
    // Esperar 500ms después de dejar de escribir para no saturar la API
    searchTimeout = setTimeout(async () => {
      console.log("Buscando:", query);
      const contenedor = document.getElementById('tmdbResults');
      contenedor.innerHTML = '<div style="padding:10px; text-align:center;"><i class="fas fa-spinner fa-spin"></i> Buscando...</div>';
      contenedor.style.display = 'block';

      try {
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=es-ES&query=${encodeURIComponent(query)}`;
        
        const response = await fetch(url);
        const data = await response.json();
        console.log("Respuesta TMDB:", data);
        
        if (data.status_code) {
          contenedor.innerHTML = `<div style="padding:10px; color:red;">Error: ${data.status_message}</div>`;
          return;
        }
        
        contenedor.innerHTML = '';
        
        if (!data.results || data.results.length === 0) {
          contenedor.innerHTML = '<div style="padding:10px; text-align:center; color:#888;">Sin resultados</div>';
        } else {
          data.results.slice(0, 8).forEach(peli => {
            const poster = peli.poster_path ? `${TMDB_IMAGE_URL}${peli.poster_path}` : 'https://via.placeholder.com/50x75';
            const anio = peli.release_date ? peli.release_date.split('-')[0] : 'N/A';
            const div = document.createElement('div');
            div.className = 'tmdb-item';
            div.innerHTML = `<img src="${poster}"><div><strong>${peli.title}</strong><br><small style="color:#888">${anio}</small></div>`;
            div.onclick = () => seleccionarPelicula(peli.id);
            contenedor.appendChild(div);
          });
        }
      } catch (error) {
        console.error("Error en búsqueda:", error);
        contenedor.innerHTML = `<div style="padding:10px; color:red;">Error: ${error.message}</div>`;
      }
    }, 500);
  }

  async function seleccionarPelicula(id) {
    console.log("Seleccionando película ID:", id);
    try {
      const response = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=es-ES`);
      const peli = await response.json();
      console.log("Detalle:", peli);
      
      if (peli.status_code) {
        alert("Error: " + peli.status_message);
        return;
      }
      
      const poster = peli.poster_path ? `${TMDB_IMAGE_URL}${peli.poster_path}` : 'https://via.placeholder.com/200x300';
      const anio = peli.release_date ? peli.release_date.split('-')[0] : 'N/A';
      const rating = peli.vote_average ? peli.vote_average.toFixed(1) : '0';
      const overview = peli.overview || 'Sin sinopsis.';
      const generos = peli.genres || [];
      const generosNombres = generos.map(g => g.name);
      
      document.getElementById('peliculaNombre').value = peli.title;
      document.getElementById('peliculaPoster').value = poster;
      document.getElementById('peliculaAnio').value = anio;
      document.getElementById('peliculaSinopsis').value = overview;
      document.getElementById('peliculaRating').value = rating;
      document.getElementById('peliculaGeneros').value = generosNombres.join(',');
      
      document.getElementById('previewPoster').src = poster;
      document.getElementById('previewTitle').textContent = `${peli.title} (${anio})`;
      document.getElementById('previewOverview').textContent = overview;
      
      const generosDiv = document.getElementById('previewGeneros');
      generosDiv.innerHTML = generosNombres.map(g => `<span class="genero-tag">${g}</span>`).join('');
      
      document.getElementById('moviePreview').style.display = 'block';
      document.getElementById('tmdbResults').style.display = 'none';
      document.getElementById('tmdbSearch').value = '';
    } catch (error) {
      alert("Error: " + error.message);
    }
  }

  function cargarPeliculas() {
    db.collection("peliculas").onSnapshot((snapshot) => {
      peliculasLocales = [];
      const tbody = document.getElementById('tablaPeliculas');
      tbody.innerHTML = '';
      if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay películas</td></tr>'; return; }
      snapshot.forEach((doc) => {
        const peli = doc.data();
        peliculasLocales.push({ id: doc.id, ...peli });
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${peli.logo}" width="40" style="border-radius:3px;" onerror="this.src='https://via.placeholder.com/40'"></td>
          <td><strong>${peli.nombre}</strong></td>
          <td><small>${peli.generos || 'Sin género'}</small></td>
          <td><span class="badge badge-secondary">${peli.anio || 'N/A'}</span></td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="editarPelicula('${doc.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger" onclick="borrarPelicula('${doc.id}')"><i class="fas fa-trash"></i></button>
          </td>`;
        tbody.appendChild(tr);
      });
    });
  }

  function editarPelicula(id) {
    const peli = peliculasLocales.find(p => p.id === id);
    if (!peli) return alert('No encontrada');
    document.getElementById('peliculaId').value = peli.id;
    document.getElementById('peliculaNombre').value = peli.nombre;
    document.getElementById('peliculaPoster').value = peli.logo;
    document.getElementById('peliculaUrl').value = peli.url;
    document.getElementById('peliculaAnio').value = peli.anio || '';
    document.getElementById('peliculaSinopsis').value = peli.sinopsis || '';
    document.getElementById('peliculaRating').value = peli.rating || '0';
    document.getElementById('peliculaGeneros').value = peli.generos || '';
    document.getElementById('previewPoster').src = peli.logo;
    document.getElementById('previewTitle').textContent = peli.nombre;
    document.getElementById('previewOverview').textContent = peli.sinopsis || '';
    const generosDiv = document.getElementById('previewGeneros');
    generosDiv.innerHTML = (peli.generos || '').split(',').filter(g => g).map(g => `<span class="genero-tag">${g}</span>`).join('');
    document.getElementById('moviePreview').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function guardarPelicula() {
    const id = document.getElementById('peliculaId').value;
    const data = {
      nombre: document.getElementById('peliculaNombre').value,
      logo: document.getElementById('peliculaPoster').value,
      url: document.getElementById('peliculaUrl').value,
      anio: document.getElementById('peliculaAnio').value,
      sinopsis: document.getElementById('peliculaSinopsis').value,
      rating: document.getElementById('peliculaRating').value,
      generos: document.getElementById('peliculaGeneros').value,
      categoria: 'Peliculas',
      fecha: new Date()
    };
    if (!data.nombre || !data.url) return alert('Título y URL obligatorios');
    try {
      if (id) {
        await db.collection("peliculas").doc(id).update(data);
        alert('✅ Actualizado');
      } else {
        data.visitas = 0;
        await db.collection("peliculas").add(data);
        alert('✅ Guardado');
      }
      limpiarPelicula();
    } catch (error) {
      alert('Error: ' + error.message);
    }
  }

  function borrarPelicula(id) {
    if (confirm('¿Eliminar esta película?')) {
      db.collection("peliculas").doc(id).delete();
    }
  }

  function limpiarPelicula() {
    document.getElementById('peliculaId').value = '';
    document.getElementById('peliculaNombre').value = '';
    document.getElementById('peliculaPoster').value = '';
    document.getElementById('peliculaAnio').value = '';
    document.getElementById('peliculaSinopsis').value = '';
    document.getElementById('peliculaRating').value = '';
    document.getElementById('peliculaGeneros').value = '';
    document.getElementById('peliculaUrl').value = '';
    document.getElementById('moviePreview').style.display = 'none';
  }

  function cerrarSesionAdmin() {
    localStorage.removeItem('nubaraPlayAdmin');
    window.location.href = 'login.html';
  }

  cargarPeliculas();
</script>
</body>
</html>
