<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Películas - NubaraPlay</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <style>
    .tmdb-results { max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: 5px; margin-top: 5px; display: none; }
    .tmdb-item { padding: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #333; background: #0a0a0c; color: #fff; }
    .tmdb-item:hover { background: #1a1a1e; }
    .tmdb-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 3px; }
    .movie-preview { background: #1a1a1e; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; text-align: center; }
    .movie-preview img { max-width: 150px; border-radius: 8px; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <a href="#" class="navbar-brand"><span class="brand-text font-weight-bold">📺 NubaraPlay</span></a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Web</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="cerrarSesionAdmin()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="admin.html" class="brand-link"><span class="brand-text font-weight-light">Panel Admin</span></a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="admin.html" class="nav-link"><i class="nav-icon fas fa-chart-line"></i><p>Dashboard</p></a></li>
          <li class="nav-item"><a href="canales.html" class="nav-link"><i class="nav-icon fas fa-tv"></i><p>Canales TV</p></a></li>
          <li class="nav-item"><a href="peliculas.html" class="nav-link active"><i class="nav-icon fas fa-film"></i><p>Películas TMDB</p></a></li>
          <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="nav-icon fas fa-users"></i><p>Usuarios</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><h1 class="m-0">🎬 Gestión de Películas (TMDB)</h1></div></div>
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-5">
            <div class="card card-warning">
              <div class="card-header"><h3 class="card-title">➕ Agregar Película</h3></div>
              <div class="card-body">
                <div class="form-group">
                  <label>Buscar en TMDB</label>
                  <input type="text" id="tmdbSearch" class="form-control" placeholder="Ej: Avatar, Batman..." onkeyup="buscarTMDB()">
                  <div class="tmdb-results" id="tmdbResults"></div>
                </div>
                <div class="movie-preview" id="moviePreview">
                  <img id="previewPoster" src="" alt="Poster">
                  <h4 id="previewTitle" style="color:#e50914; margin-top:10px;"></h4>
                </div>
                <input type="hidden" id="peliculaNombre">
                <input type="hidden" id="peliculaPoster">
                <input type="hidden" id="peliculaAnio">
                <div class="form-group"><label>URL del Stream</label><input type="text" id="peliculaUrl" class="form-control" placeholder="https://..."></div>
                <button onclick="guardarPelicula()" class="btn btn-success btn-block"><i class="fas fa-save"></i> Guardar Película</button>
                <button onclick="limpiarPelicula()" class="btn btn-secondary btn-block mt-2"><i class="fas fa-times"></i> Limpiar</button>
              </div>
            </div>
          </div>
          <div class="col-md-7">
            <div class="card card-info">
              <div class="card-header"><h3 class="card-title">Películas Agregadas</h3></div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead><tr><th>Póster</th><th>Título</th><th>Año</th><th>Acciones</th></tr></thead>
                    <tbody id="tablaPeliculas"><tr><td colspan="4" class="text-center">Cargando...</td></tr></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<script>
  verificarAdmin();

  async function buscarTMDB() {
    const query = document.getElementById('tmdbSearch').value.trim();
    if (query.length < 2) { document.getElementById('tmdbResults').style.display = 'none'; return; }
    const response = await fetch(`${TMDB_BASE_URL}/search/movie?api_key=${TMDB_API_KEY}&language=es-ES&query=${encodeURIComponent(query)}`);
    const data = await response.json();
    
    const contenedor = document.getElementById('tmdbResults');
    contenedor.innerHTML = '';
    if (data.results.length === 0) {
      contenedor.innerHTML = '<div style="padding:10px; color:#888;">No encontrado</div>';
    } else {
      data.results.slice(0, 8).forEach(peli => {
        const poster = peli.poster_path ? `${TMDB_IMAGE_URL}${peli.poster_path}` : 'https://via.placeholder.com/40x60/1a1a1e/fff?text=No+Img';
        const anio = peli.release_date ? peli.release_date.split('-')[0] : 'N/A';
        const div = document.createElement('div');
        div.className = 'tmdb-item';
        div.innerHTML = `<img src="${poster}"><div><strong>${peli.title}</strong><br><small>${anio}</small></div>`;
        div.onclick = () => seleccionarPelicula(peli.title, poster, anio);
        contenedor.appendChild(div);
      });
    }
    contenedor.style.display = 'block';
  }

  function seleccionarPelicula(titulo, poster, anio) {
    document.getElementById('peliculaNombre').value = titulo;
    document.getElementById('peliculaPoster').value = poster;
    document.getElementById('peliculaAnio').value = anio;
    document.getElementById('previewPoster').src = poster;
    document.getElementById('previewTitle').textContent = `${titulo} (${anio})`;
    document.getElementById('moviePreview').style.display = 'block';
    document.getElementById('tmdbResults').style.display = 'none';
    document.getElementById('tmdbSearch').value = '';
  }

  async function guardarPelicula() {
    const nombre = document.getElementById('peliculaNombre').value;
    const poster = document.getElementById('peliculaPoster').value;
    const url = document.getElementById('peliculaUrl').value;
    const anio = document.getElementById('peliculaAnio').value;

    if (!nombre || !url) return Swal.fire('Error', 'Título y URL son obligatorios', 'error');

    await db.collection("peliculas").add({
      nombre, logo: poster, url, anio, categoria: 'Peliculas', fecha: new Date(), visitas: 0
    });
    Swal.fire('¡Éxito!', 'Película guardada', 'success');
    limpiarPelicula();
  }

  function cargarPeliculas() {
    db.collection("peliculas").onSnapshot((snapshot) => {
      const tbody = document.getElementById('tablaPeliculas');
      tbody.innerHTML = '';
      if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="4" class="text-center">No hay películas</td></tr>'; return; }
      snapshot.forEach((doc) => {
        const peli = doc.data();
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${peli.logo}" width="40" style="border-radius:3px;" onerror="this.src='https://via.placeholder.com/40'"></td>
          <td><strong>${peli.nombre}</strong></td>
          <td>${peli.anio || 'N/A'}</td>
          <td><button class="btn btn-sm btn-danger" onclick="db.collection('peliculas').doc('${doc.id}').delete()"><i class="fas fa-trash"></i></button></td>`;
        tbody.appendChild(tr);
      });
    });
  }

  function limpiarPelicula() {
    document.getElementById('peliculaNombre').value = '';
    document.getElementById('peliculaPoster').value = '';
    document.getElementById('peliculaAnio').value = '';
    document.getElementById('peliculaUrl').value = '';
    document.getElementById('moviePreview').style.display = 'none';
  }

  cargarPeliculas();
</script>
</body>
</html>
