<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Películas - NubaraPlay</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <style>
    .light-mode { background-color: #f4f6f9; }
    .light-mode .content-wrapper { background-color: #f4f6f9; }
    .light-mode .card { background-color: #fff; }
    .tmdb-results { max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: 5px; margin-top: 5px; display: none; background: #0a0a0c; }
    .tmdb-item { padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #333; color: #fff; }
    .tmdb-item:hover { background: #1a1a1e; }
    .tmdb-item img { width: 50px; height: 75px; object-fit: cover; border-radius: 3px; }
    .movie-preview { background: #1a1a1e; padding: 20px; border-radius: 8px; margin-top: 15px; display: none; }
    .movie-preview img { max-width: 200px; border-radius: 8px; display: block; margin: 0 auto; }
    .movie-preview h4 { color:#e50914; margin: 15px 0 10px; text-align: center; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <a href="#" class="navbar-brand"><span class="brand-text font-weight-bold">📺 NubaraPlay</span></a>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" href="#" onclick="toggleDarkMode()" role="button"><i class="fas fa-moon" id="darkModeIcon"></i></a></li>
      <li class="nav-item"><a class="nav-link" href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Web</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="cerrarSesionAdmin()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="admin.html" class="brand-link"><span class="brand-text font-weight-light">Panel Admin</span></a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="admin.html" class="nav-link"><i class="nav-icon fas fa-chart-line"></i><p>Dashboard</p></a></li>
          <li class="nav-item"><a href="canales.html" class="nav-link"><i class="nav-icon fas fa-tv"></i><p>Canales TV</p></a></li>
          <li class="nav-item"><a href="peliculas.html" class="nav-link active"><i class="nav-icon fas fa-film"></i><p>Películas TMDB</p></a></li>
          <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="nav-icon fas fa-users"></i><p>Usuarios</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><h1 class="m-0"> Gestión de Películas (TMDB)</h1></div></div>
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-5">
            <div class="card card-warning">
              <div class="card-header"><h3 class="card-title" id="formTitle">➕ Agregar Película</h3></div>
              <div class="card-body">
                <input type="hidden" id="peliculaId">
                <div class="form-group">
                  <label><i class="fas fa-search"></i> Buscar en TMDB</label>
                  <input type="text" id="tmdbSearch" class="form-control" placeholder="Ej: Avatar, Batman..." onkeyup="buscarTMDB()">
                  <div class="tmdb-results" id="tmdbResults"></div>
                </div>
                <div class="movie-preview" id="moviePreview">
                  <img id="previewPoster" src="" alt="Poster">
                  <h4 id="previewTitle"></h4>
                </div>
                <input type="hidden" id="peliculaNombre">
                <input type="hidden" id="peliculaPoster">
                <input type="hidden" id="peliculaAnio">
                <div class="form-group" style="margin-top: 15px;">
                  <label><i class="fas fa-link"></i> URL del Stream</label>
                  <input type="text" id="peliculaUrl" class="form-control" placeholder="https://vimeos.net/embed-xxxxx.htm">
                </div>
                <button onclick="guardarPelicula()" class="btn btn-success btn-block"><i class="fas fa-save" id="btnIcon"></i> <span id="btnText">Guardar</span></button>
                <button onclick="limpiarPelicula()" class="btn btn-secondary btn-block mt-2"><i class="fas fa-times"></i> Limpiar</button>
              </div>
            </div>
          </div>
          <div class="col-md-7">
            <div class="card card-info">
              <div class="card-header"><h3 class="card-title">Películas Agregadas</h3></div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead><tr><th>Póster</th><th>Título</th><th>Año</th><th style="width:100px">Acciones</th></tr></thead>
                    <tbody id="tablaPeliculas"><tr><td colspan="4" class="text-center">Cargando...</td></tr></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<script>
  verificarAdmin();
  const TMDB_API_KEY = "a85b85e615389ded96ae9e357c2f7ac1";
  const TMDB_IMAGE_URL = "https://image.tmdb.org/t/p/w500";
  let peliculasLocales = [];

  function toggleDarkMode() {
    const body = document.body;
    const icon = document.getElementById('darkModeIcon');
    const navbar = document.querySelector('.main-header');
    const sidebar = document.querySelector('.main-sidebar');
    if (body.classList.contains('dark-mode')) {
      body.classList.remove('dark-mode'); body.classList.add('light-mode');
      navbar.classList.remove('navbar-dark', 'navbar-dark-primary'); navbar.classList.add('navbar-white', 'navbar-light');
      sidebar.classList.remove('sidebar-dark-primary'); sidebar.classList.add('sidebar-light-primary');
      localStorage.setItem('nubaraPlayTheme', 'light'); icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
    } else {
      body.classList.add('dark-mode'); body.classList.remove('light-mode');
      navbar.classList.remove('navbar-white', 'navbar-light'); navbar.classList.add('navbar-dark', 'navbar-dark-primary');
      sidebar.classList.remove('sidebar-light-primary'); sidebar.classList.add('sidebar-dark-primary');
      localStorage.setItem('nubaraPlayTheme', 'dark'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
    }
  }

  function loadSavedTheme() {
    const savedTheme = localStorage.getItem('nubaraPlayTheme');
    const icon = document.getElementById('darkModeIcon');
    const navbar = document.querySelector('.main-header');
    const sidebar = document.querySelector('.main-sidebar');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      navbar.classList.remove('navbar-white', 'navbar-light'); navbar.classList.add('navbar-dark', 'navbar-dark-primary');
      sidebar.classList.remove('sidebar-light-primary'); sidebar.classList.add('sidebar-dark-primary');
      icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
    }
  }

  async function buscarTMDB() {
    const query = document.getElementById('tmdbSearch').value.trim();
    if (query.length < 2) { document.getElementById('tmdbResults').style.display = 'none'; return; }
    const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=es-ES&query=${encodeURIComponent(query)}`);
    const data = await response.json();
    const contenedor = document.getElementById('tmdbResults');
    contenedor.innerHTML = '';
    if (data.results.length === 0) {
      contenedor.innerHTML = '<div style="padding:10px; color:#888; text-align:center;">No encontrado</div>';
    } else {
      data.results.slice(0, 8).forEach(peli => {
        const poster = peli.poster_path ? `${TMDB_IMAGE_URL}${peli.poster_path}` : 'https://via.placeholder.com/50x75';
        const anio = peli.release_date ? peli.release_date.split('-')[0] : 'N/A';
        const div = document.createElement('div');
        div.className = 'tmdb-item';
        div.innerHTML = `<img src="${poster}"><div><strong>${peli.title}</strong><br><small style="color:#888">${anio}</small></div>`;
        div.onclick = () => seleccionarPelicula(peli.title, poster, anio);
        contenedor.appendChild(div);
      });
    }
    contenedor.style.display = 'block';
  }

  function seleccionarPelicula(titulo, poster, anio) {
    document.getElementById('peliculaNombre').value = titulo;
    document.getElementById('peliculaPoster').value = poster;
    document.getElementById('peliculaAnio').value = anio;
    document.getElementById('previewPoster').src = poster;
    document.getElementById('previewTitle').textContent = `${titulo} (${anio})`;
    document.getElementById('moviePreview').style.display = 'block';
    document.getElementById('tmdbResults').style.display = 'none';
    document.getElementById('tmdbSearch').value = '';
  }

  function cargarPeliculas() {
    db.collection("peliculas").onSnapshot((snapshot) => {
      peliculasLocales = [];
      const tbody = document.getElementById('tablaPeliculas');
      tbody.innerHTML = '';
      
      if (snapshot.empty) { 
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">No hay películas</td></tr>'; 
        return; 
      }
      
      snapshot.forEach((doc) => {
        const peli = doc.data();
        peliculasLocales.push({ id: doc.id, ...peli });
        
        const tr = document.createElement('tr');
        // ✅ Usar solo el ID en el onclick
        tr.innerHTML = `
          <td><img src="${peli.logo}" width="40" style="border-radius:3px;" onerror="this.src='https://via.placeholder.com/40'"></td>
          <td><strong>${peli.nombre}</strong></td>
          <td><span class="badge badge-secondary">${peli.anio || 'N/A'}</span></td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="editarPelicula('${doc.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger" onclick="borrarPelicula('${doc.id}')"><i class="fas fa-trash"></i></button>
          </td>`;
        tbody.appendChild(tr);
      });
    });
  }

  // ✅ Buscar la película en el array local por ID
  function editarPelicula(id) {
    const peli = peliculasLocales.find(p => p.id === id);
    if (!peli) {
      Swal.fire('Error', 'No se encontró la película', 'error');
      return;
    }
    
    // Cargar datos en el formulario
    document.getElementById('peliculaId').value = peli.id;
    document.getElementById('peliculaNombre').value = peli.nombre;
    document.getElementById('peliculaPoster').value = peli.logo;
    document.getElementById('peliculaUrl').value = peli.url;
    document.getElementById('peliculaAnio').value = peli.anio || '';
    document.getElementById('previewPoster').src = peli.logo;
    document.getElementById('previewTitle').textContent = peli.nombre;
    document.getElementById('moviePreview').style.display = 'block';
    
    // Cambiar UI a modo edición
    document.getElementById('formTitle').innerHTML = '✏️ Editar Película';
    document.getElementById('btnText').textContent = 'Actualizar';
    document.getElementById('btnIcon').className = 'fas fa-sync';
    
    // Scroll al formulario
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function guardarPelicula() {
    const id = document.getElementById('peliculaId').value;
    const data = {
      nombre: document.getElementById('peliculaNombre').value,
      logo: document.getElementById('peliculaPoster').value,
      url: document.getElementById('peliculaUrl').value,
      anio: document.getElementById('peliculaAnio').value,
      categoria: 'Peliculas',
      fecha: new Date()
    };
    
    if (!data.nombre || !data.url) {
      return Swal.fire('Error', 'Título y URL son obligatorios', 'error');
    }
    
    try {
      if (id) {
        // Actualizar existente
        await db.collection("peliculas").doc(id).update(data);
        Swal.fire('¡Actualizado!', 'Película actualizada correctamente', 'success');
      } else {
        // Crear nueva
        data.visitas = 0;
        await db.collection("peliculas").add(data);
        Swal.fire('¡Éxito!', 'Película guardada correctamente', 'success');
      }
      limpiarPelicula();
    } catch (error) {
      Swal.fire('Error', 'No se pudo guardar: ' + error.message, 'error');
    }
  }

  function borrarPelicula(id) {
    Swal.fire({ 
      title: '¿Eliminar película?', 
      icon: 'warning', 
      showCancelButton: true, 
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then((r) => {
      if (r.isConfirmed) {
        db.collection("peliculas").doc(id).delete();
        Swal.fire('Eliminada', 'La película ha sido eliminada', 'success');
      }
    });
  }

  function limpiarPelicula() {
    document.getElementById('peliculaId').value = '';
    document.getElementById('peliculaNombre').value = '';
    document.getElementById('peliculaPoster').value = '';
    document.getElementById('peliculaAnio').value = '';
    document.getElementById('peliculaUrl').value = '';
    document.getElementById('moviePreview').style.display = 'none';
    document.getElementById('formTitle').innerHTML = ' Agregar Película';
    document.getElementById('btnText').textContent = 'Guardar';
    document.getElementById('btnIcon').className = 'fas fa-save';
  }

  loadSavedTheme();
  cargarPeliculas();
</script>
</body>
</html>
