<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 NubaraPlay - TV Online</title>
    <meta name="theme-color" content="#e50914">
    <meta name="description" content="NubaraPlay - TV Online en vivo">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0c; color: #fff; min-height: 100vh; }
        
        /* LOGIN SCREEN */
        #loginScreen { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }
        .login-box { 
            background: rgba(20, 20, 20, 0.95); 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            max-width: 400px; 
            width: 100%; 
            text-align: center; 
        }
        .login-box h1 { 
            font-size: 2em; 
            background: linear-gradient(90deg, #e50914, #ff6b6b); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 10px; 
        }
        .login-box p { color: #aaa; margin-bottom: 30px; }
        .login-box input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #1a1a1e; 
            color: #fff; 
            font-size: 1.5em; 
            text-align: center; 
            letter-spacing: 5px; 
            margin-bottom: 20px; 
            text-transform: uppercase;
            font-weight: bold;
        }
        .login-box input:focus { border-color: #e50914; outline: none; }
        .login-box button { 
            width: 100%; 
            padding: 15px; 
            background: #e50914; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1em; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s; 
        }
        .login-box button:hover { background: #ff1f2c; transform: translateY(-2px); }
        .error-msg { color: #e50914; margin-top: 15px; display: none; }
        
        /* MAIN APP */
        #mainApp { display: none; }
        header { 
            background: rgba(20, 20, 20, 0.85); 
            backdrop-filter: blur(10px); 
            padding: 15px 20px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .header-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 10px; 
            margin-bottom: 10px; 
        }
        header h1 { 
            font-size: 1.8em; 
            background: linear-gradient(90deg, #e50914, #ff6b6b); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 800; 
        }
        .header-controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        .control-btn { 
            background: #1a1a1e; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.9em; 
            transition: all 0.3s; 
        }
        .control-btn:hover { background: #e50914; border-color: #e50914; }
        .control-btn.active { background: #e50914; }
        .user-info {
            background: rgba(229, 9, 20, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #e50914;
        }
        .search-box { max-width: 500px; margin: 0 auto; }
        .search-box input { 
            width: 100%; 
            padding: 10px 20px; 
            border-radius: 25px; 
            border: 1px solid #333; 
            background: #1a1a1e; 
            color: #fff; 
            font-size: 1em; 
            outline: none; 
        }
        .search-box input:focus { border-color: #e50914; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 30px; }
        
        /* SECCIONES */
        .seccion { margin-bottom: 50px; }
        .seccion-titulo { 
            font-size: 1.6em; 
            color: #fff; 
            margin-bottom: 25px; 
            padding-bottom: 10px; 
            border-bottom: 3px solid #e50914; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            font-weight: bold;
        }
        
        /* GRID */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
        }
        
        /* CARDS - CANALES */
        .canal-card { 
            background: #16161a; 
            border-radius: 12px; 
            overflow: hidden; 
            transition: all 0.3s; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.05); 
            position: relative; 
        }
        .canal-card:hover { 
            transform: translateY(-8px); 
            border-color: #e50914; 
            box-shadow: 0 15px 30px rgba(229, 9, 20, 0.3); 
        }
        .canal-card img { 
            width: 100%; 
            height: 120px; 
            object-fit: contain; 
            background: #000; 
            padding: 15px; 
        }
        .canal-card .card-title { 
            padding: 15px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.95em; 
            color: #ddd; 
        }
        .canal-card .card-stats { 
            display: flex; 
            justify-content: space-between; 
            padding: 0 15px 15px; 
            font-size: 0.8em; 
            color: #888; 
        }
        .stars { color: #ffd700; }
        
        /* CARDS - PELICULAS */
        .pelicula-card { 
            background: #16161a; 
            border-radius: 12px; 
            overflow: hidden; 
            transition: all 0.3s; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.05); 
            position: relative; 
        }
        .pelicula-card:hover { 
            transform: translateY(-8px) scale(1.02); 
            border-color: #e50914; 
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.4); 
        }
        .pelicula-card img { 
            width: 100%; 
            height: 270px; 
            object-fit: cover; 
            background: #000; 
        }
        .pelicula-card .card-title { 
            padding: 12px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.9em; 
            color: #fff; 
            background: rgba(0,0,0,0.7);
        }
        .pelicula-card .card-info { 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 0.85em; 
        }
        .pelicula-card .anio { 
            background: #333; 
            padding: 3px 8px; 
            border-radius: 4px; 
            color: #aaa; 
        }
        .pelicula-card .rating { 
            color: #ffd700; 
        }
        
        /* FAV BUTTON */
        .fav-btn { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(0,0,0,0.7); 
            border: none; 
            color: #fff; 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 1.2em; 
            transition: all 0.3s; 
            z-index: 10; 
        }
        .fav-btn:hover { background: rgba(229, 9, 20, 0.8); }
        .fav-btn.active { color: #ffd700; }
        
        /* MODAL */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.95); 
            backdrop-filter: blur(5px); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            padding: 10px; 
        }
        .modal.active { display: flex; }
        .modal-content { 
            width: 95%; 
            max-width: 900px; 
            background: #111; 
            border-radius: 10px; 
            overflow: hidden; 
            max-height: 95vh; 
            display: flex; 
            flex-direction: column; 
        }
        .modal-content iframe { 
            width: 100%; 
            aspect-ratio: 16/9; 
            border: none; 
            background: #000; 
        }
        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 20px; 
            background: #1a1a1e; 
            flex-wrap: wrap; 
            gap: 10px; 
        }
        .modal-header h3 { 
            color: #e50914; 
            font-size: 1.1em; 
            margin: 0; 
        }
        .btn { 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            border: none; 
            text-decoration: none; 
            display: inline-flex; 
            gap: 5px; 
            font-size: 0.9em; 
        }
        .btn-external { background: #2a2a2e; color: #fff; }
        .btn-close { background: #e50914; color: white; }
        
        .no-results { text-align: center; color: #666; padding: 40px; display: none; }
        .loading { text-align: center; padding: 50px; color: #e50914; font-size: 1.2em; }
        
        @media (max-width: 600px) {
            header h1 { font-size: 1.5em; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .canal-card img { height: 100px; }
            .pelicula-card img { height: 210px; }
            .modal-content { width: 100%; max-width: 100%; border-radius: 0; }
            .modal-header { flex-direction: column; text-align: center; }
            .login-box { padding: 30px 20px; }
            .login-box h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>📺 NubaraPlay</h1>
            <p>Ingresa tu código de acceso de 5 dígitos</p>
            <input type="text" id="accessCode" placeholder="EJ: NH45F" maxlength="5" onkeyup="this.value = this.value.toUpperCase()" autocomplete="off">
            <button onclick="verificarCodigo()">🔓 Acceder</button>
            <p class="error-msg" id="errorMsg">❌ Código inválido o expirado</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp">
        <header>
            <div class="header-top">
                <h1>📺 NubaraPlay</h1>
                <div class="header-controls">
                    <span class="user-info" id="userInfo">👤 Usuario</span>
                    <button class="control-btn" id="viewToggle" onclick="toggleView()">🔲 Grid</button>
                    <button class="control-btn" id="langToggle" onclick="toggleLanguage()">🌐 EN</button>
                    <button class="control-btn" onclick="cerrarSesion()">🚪 Salir</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="buscador" placeholder="🔍 Buscar canal o película..." onkeyup="filtrarContenido()">
            </div>
        </header>

        <div class="container">
            <!-- SECCIÓN CANALES TV -->
            <div class="seccion" id="seccionCanales">
                <h2 class="seccion-titulo">📺 Canales de TV en Vivo</h2>
                <div id="contenedorCanales"><div class="loading">⏳ Cargando canales...</div></div>
            </div>
            
            <!-- SECCIÓN PELÍCULAS -->
            <div class="seccion" id="seccionPeliculas">
                <h2 class="seccion-titulo">🎬 Películas</h2>
                <div id="contenedorPeliculas"><div class="loading"> Cargando películas...</div></div>
            </div>
            
            <div class="no-results" id="noResults">😕 No se encontraron resultados.</div>
        </div>
    </div>

    <!-- MODAL REPRODUCTOR -->
    <div class="modal" id="modal" onclick="cerrarModalFuera(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitulo">Cargando...</h3>
                <div style="display: flex; gap: 10px;">
                    <a href="#" id="externalLink" target="_blank" class="btn btn-external">🔗 Abrir fuera</a>
                    <button class="btn btn-close" onclick="cerrarModal()">✖ Cerrar</button>
                </div>
            </div>
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
          apiKey: "AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",
          authDomain: "nubaraplay.firebaseapp.com",
          projectId: "nubaraplay",
          storageBucket: "nubaraplay.firebasestorage.app",
          messagingSenderId: "873822057409",
          appId: "1:873822057409:web:f854a974f457eedd0c7540"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let todosLosCanales = [];
        let todasLasPeliculas = [];
        let vistaActual = 'grid';
        let idiomaActual = 'es';
        let usuarioActual = null;

        // VERIFICAR CÓDIGO
        async function verificarCodigo() {
            const codigo = document.getElementById('accessCode').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');
            
            if (!codigo || codigo.length !== 5) {
                errorMsg.textContent = '❌ Ingresa un código de 5 caracteres';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const snapshot = await db.collection("usuarios").where("codigo", "==", codigo).get();
                
                if (snapshot.empty) {
                    errorMsg.textContent = '❌ Código inválido';
                    errorMsg.style.display = 'block';
                    return;
                }

                const userDoc = snapshot.docs[0];
                const userData = userDoc.data();
                const fechaExpiracion = userData.fechaExpiracion?.toDate ? userData.fechaExpiracion.toDate() : new Date(userData.fechaExpiracion);
                const ahora = new Date();

                if (fechaExpiracion < ahora) {
                    errorMsg.textContent = '❌ Código expirado';
                    errorMsg.style.display = 'block';
                    return;
                }

                usuarioActual = { id: userDoc.id, ...userData };
                localStorage.setItem('nubaraPlayUser', JSON.stringify(usuarioActual));
                localStorage.setItem('nubaraPlayUserExpiry', fechaExpiracion.getTime());
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                
                const tipoTexto = userData.tipo === 'demo' ? '🎬 Demo' : '👤 Final';
                document.getElementById('userInfo').textContent = `${tipoTexto} - ${userData.nombre}`;
                
                cargarCanales();
                cargarPeliculas();
            } catch (error) {
                console.error('Error:', error);
                errorMsg.textContent = '❌ Error de conexión';
                errorMsg.style.display = 'block';
            }
        }

        // VERIFICAR SESIÓN AL CARGAR
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('nubaraPlayUser');
            const savedExpiry = localStorage.getItem('nubaraPlayUserExpiry');
            
            if (savedUser && savedExpiry) {
                const expiry = parseInt(savedExpiry);
                if (Date.now() < expiry) {
                    usuarioActual = JSON.parse(savedUser);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    
                    const tipoTexto = usuarioActual.tipo === 'demo' ? '🎬 Demo' : '👤 Final';
                    document.getElementById('userInfo').textContent = `${tipoTexto} - ${usuarioActual.nombre}`;
                    
                    cargarCanales();
                    cargarPeliculas();
                } else {
                    localStorage.removeItem('nubaraPlayUser');
                    localStorage.removeItem('nubaraPlayUserExpiry');
                }
            }
        });

        function cerrarSesion() {
            localStorage.removeItem('nubaraPlayUser');
            localStorage.removeItem('nubaraPlayUserExpiry');
            location.reload();
        }

        function toggleView() {
            vistaActual = vistaActual === 'grid' ? 'list' : 'grid';
            localStorage.setItem('nubaraPlayVista', vistaActual);
            document.getElementById('viewToggle').innerHTML = vistaActual === 'grid' ? '🔲 Grid' : '📋 Lista';
            renderizarCanales(todosLosCanales);
            renderizarPeliculas(todasLasPeliculas);
        }

        function toggleLanguage() {
            idiomaActual = idiomaActual === 'es' ? 'en' : 'es';
            localStorage.setItem('nubaraPlayIdioma', idiomaActual);
            document.getElementById('langToggle').innerHTML = idiomaActual === 'es' ? '🌐 EN' : '🌐 ES';
        }

        function cargarCanales() {
            db.collection("canales").where("categoria", "!=", "Peliculas").onSnapshot((snapshot) => {
                todosLosCanales = [];
                snapshot.forEach((doc) => todosLosCanales.push({ id: doc.id, ...doc.data() }));
                renderizarCanales(todosLosCanales);
            });
        }

        function cargarPeliculas() {
            db.collection("peliculas").orderBy("fecha", "desc").onSnapshot((snapshot) => {
                todasLasPeliculas = [];
                snapshot.forEach((doc) => todasLasPeliculas.push({ id: doc.id, ...doc.data() }));
                renderizarPeliculas(todasLasPeliculas);
            });
        }

        function renderizarCanales(canales) {
            const contenedor = document.getElementById('contenedorCanales');
            contenedor.innerHTML = '';
            
            if (canales.length === 0) { 
                contenedor.innerHTML = '<p style="color:#666; text-align:center; padding:40px;">No hay canales disponibles</p>';
                return; 
            }
            
            const grid = document.createElement('div');
            grid.className = 'grid';
            
            canales.forEach(canal => {
                const card = document.createElement('div');
                card.className = 'canal-card';
                card.innerHTML = `
                    <img src="${canal.logo}" alt="${canal.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x120/1a1a1e/fff?text=TV'">
                    <div class="card-title">${canal.nombre}</div>
                    <div class="card-stats">
                        <span class="stars">★ ${canal.rating || '0.0'}</span>
                        <span>👁 ${canal.visitas || 0}</span>
                    </div>
                `;
                card.onclick = () => abrirCanal(canal);
                grid.appendChild(card);
            });
            
            contenedor.appendChild(grid);
        }

        function renderizarPeliculas(peliculas) {
            const contenedor = document.getElementById('contenedorPeliculas');
            contenedor.innerHTML = '';
            
            if (peliculas.length === 0) { 
                contenedor.innerHTML = '<p style="color:#666; text-align:center; padding:40px;">No hay películas disponibles</p>';
                return; 
            }
            
            const grid = document.createElement('div');
            grid.className = 'grid';
            
            peliculas.forEach(peli => {
                const card = document.createElement('div');
                card.className = 'pelicula-card';
                card.innerHTML = `
                    <img src="${peli.logo}" alt="${peli.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x270/1a1a1e/fff?text=No+Image'">
                    <div class="card-title">${peli.nombre}</div>
                    <div class="card-info">
                        <span class="anio">${peli.anio || 'N/A'}</span>
                        <span class="rating">⭐ ${peli.rating || '0'}</span>
                    </div>
                `;
                card.onclick = () => abrirPelicula(peli);
                grid.appendChild(card);
            });
            
            contenedor.appendChild(grid);
        }

        function abrirCanal(canal) {
            db.collection("canales").doc(canal.id).update({ visitas: (canal.visitas || 0) + 1 });
            document.getElementById('modalTitulo').textContent = `▶ ${canal.nombre}`;
            document.getElementById('playerFrame').src = canal.url;
            document.getElementById('externalLink').href = canal.url;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function abrirPelicula(pelicula) {
            db.collection("peliculas").doc(pelicula.id).update({ visitas: (pelicula.visitas || 0) + 1 });
            document.getElementById('modalTitulo').textContent = `🎬 ${pelicula.nombre} (${pelicula.anio || 'N/A'})`;
            document.getElementById('playerFrame').src = pelicula.url;
            document.getElementById('externalLink').href = pelicula.url;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('playerFrame').src = '';
            document.body.style.overflow = 'auto';
        }
        
        function cerrarModalFuera(event) { 
            if (event.target.id === 'modal') cerrarModal(); 
        }

        function filtrarContenido() {
            const texto = document.getElementById('buscador').value.toLowerCase().trim();
            
            const canalesFiltrados = todosLosCanales.filter(c => c.nombre.toLowerCase().includes(texto));
            const peliculasFiltradas = todasLasPeliculas.filter(p => p.nombre.toLowerCase().includes(texto));
            
            renderizarCanales(canalesFiltrados);
            renderizarPeliculas(peliculasFiltradas);
            
            if (canalesFiltrados.length === 0 && peliculasFiltradas.length === 0) {
                document.getElementById('noResults').style.display = 'block';
            } else {
                document.getElementById('noResults').style.display = 'none';
            }
        }
    </script>
</body>
</html>
