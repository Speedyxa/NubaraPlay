<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NubaraPlay - TV Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0c; color: #fff; min-height: 100vh; }
        header { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        header h1 { font-size: 2em; background: linear-gradient(90deg, #e50914, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .search-box { max-width: 500px; margin: 15px auto 0; }
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid #333; background: #1a1a1e; color: #fff; font-size: 1em; outline: none; }
        .search-box input:focus { border-color: #e50914; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .seccion { margin-bottom: 40px; }
        .seccion-titulo { font-size: 1.4em; color: #fff; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e50914; display: flex; align-items: center; gap: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: #16161a; border-radius: 12px; overflow: hidden; transition: all 0.3s; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card:hover { transform: translateY(-5px); border-color: #e50914; box-shadow: 0 10px 25px rgba(229, 9, 20, 0.2); }
        .card img { width: 100%; height: 100px; object-fit: contain; background: #000; padding: 15px; }
        .card-title { padding: 12px; text-align: center; font-weight: 600; font-size: 0.9em; color: #ddd; }
        .card-stats { display: flex; justify-content: space-between; padding: 0 12px 12px; font-size: 0.75em; color: #888; }
        .stars { color: #ffd700; }
        .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 1.2em; transition: all 0.3s; z-index: 10; }
        .fav-btn:hover { background: rgba(229, 9, 20, 0.8); }
        .fav-btn.active { color: #ffd700; }
        
        /* MODAL COMPACTO */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; padding: 10px; }
        .modal.active { display: flex; }
        .modal-content { width: 95%; max-width: 800px; background: #111; border-radius: 10px; overflow: hidden; max-height: 95vh; display: flex; flex-direction: column; }
        .modal-content iframe { width: 100%; aspect-ratio: 16/9; border: none; background: #000; flex: 1; }
        
        /* HEADER DEL MODAL MÁS COMPACTO */
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1a1a1e; flex-wrap: wrap; gap: 8px; }
        .modal-header h3 { color: #e50914; font-size: 1em; margin: 0; }
        
        /* BOTONES MÁS PEQUEÑOS */
        .btn { padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; border: none; text-decoration: none; display: inline-flex; gap: 5px; font-size: 0.85em; }
        .btn-external { background: #2a2a2e; color: #fff; }
        .btn-close { background: #e50914; color: white; }
        
        /* SECCIÓN DE RATING MÁS PEQUEÑA */
        .rating-section { padding: 10px 15px; background: #1a1a1e; border-top: 1px solid #333; text-align: center; }
        .rating-section p { margin: 5px 0; font-size: 0.85em; color: #aaa; }
        .rating-stars { font-size: 1.2em; cursor: pointer; color: #555; }
        .rating-stars .star { transition: color 0.2s; margin: 0 2px; }
        .rating-stars .star:hover, .rating-stars .star.active { color: #ffd700; }
        #ratingText { font-size: 0.8em !important; color: #888 !important; margin-top: 5px !important; }
        
        .no-results { text-align: center; color: #666; padding: 40px; display: none; }
        .loading { text-align: center; padding: 50px; color: #e50914; font-size: 1.2em; }
        .favoritos-section { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .favoritos-section h2 { color: #ffd700; margin-bottom: 15px; }
        
        /* RESPONSIVE PARA MÓVIL */
        @media (max-width: 600px) {
            .modal-content { width: 100%; max-width: 100%; border-radius: 0; }
            .modal-header { flex-direction: column; text-align: center; }
            .modal-header h3 { font-size: 0.9em; }
            .btn { font-size: 0.8em; padding: 5px 10px; }
            .rating-stars { font-size: 1em; }
        }
    </style>
</head>
<body>
    <header>
        <h1>NubaraPlay</h1>
        <div class="search-box">
            <input type="text" id="buscador" placeholder="🔍 Buscar canal..." onkeyup="filtrarCanales()">
        </div>
    </header>

    <div class="container">
        <div id="favoritosSection" class="favoritos-section" style="display: none;">
            <h2>⭐ Mis Favoritos</h2>
            <div class="grid" id="favoritosGrid"></div>
        </div>

        <div id="contenedor"><div class="loading">⏳ Cargando canales...</div></div>
        <div class="no-results" id="noResults">😕 No se encontraron canales.</div>
    </div>

    <div class="modal" id="modal" onclick="cerrarModalFuera(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitulo">Cargando...</h3>
                <div style="display: flex; gap: 8px;">
                    <a href="#" id="externalLink" target="_blank" class="btn btn-external"> Abrir fuera</a>
                    <button class="btn btn-close" onclick="cerrarModal()">✖ Cerrar</button>
                </div>
            </div>
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
            <div class="rating-section">
                <p>¿Cómo calificarías este canal?</p>
                <div class="rating-stars" id="ratingStars">
                    <span class="star" data-rating="1">★</span><span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span><span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
                <p id="ratingText"></p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",
          authDomain: "nubaraplay.firebaseapp.com",
          projectId: "nubaraplay",
          storageBucket: "nubaraplay.firebasestorage.app",
          messagingSenderId: "873822057409",
          appId: "1:873822057409:web:f854a974f457eedd0c7540"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let todosLosCanales = [];
        let canalActual = null;
        const iconosCategorias = { 'Deportes': '⚽', 'Noticias': '📰', 'Entretenimiento': '', 'Peliculas': '🎬', 'Musica': '', 'Default': '📡' };

        function getFavoritos() { return JSON.parse(localStorage.getItem('nubaraPlayFavoritos') || '[]'); }

        function toggleFavorito(canalId, event) {
            if(event) event.stopPropagation();
            let favoritos = getFavoritos();
            const index = favoritos.indexOf(canalId);
            if (index > -1) favoritos.splice(index, 1);
            else favoritos.push(canalId);
            localStorage.setItem('nubaraPlayFavoritos', JSON.stringify(favoritos));
            renderizarFavoritos();
            renderizarCanales(todosLosCanales);
        }

        function renderizarFavoritos() {
            const favoritos = getFavoritos();
            const section = document.getElementById('favoritosSection');
            const grid = document.getElementById('favoritosGrid');
            if (favoritos.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            grid.innerHTML = '';
            const canalesFav = todosLosCanales.filter(c => favoritos.includes(c.id));
            canalesFav.forEach(canal => grid.appendChild(crearCard(canal)));
        }

        function crearCard(canal) {
            const favoritos = getFavoritos();
            const esFav = favoritos.includes(canal.id);
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-nombre', canal.nombre.toLowerCase());
            card.innerHTML = `
                <button class="fav-btn ${esFav ? 'active' : ''}" onclick="toggleFavorito('${canal.id}', event)">${esFav ? '★' : '☆'}</button>
                <img src="${canal.logo}" alt="${canal.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x120/1a1a1e/fff?text=TV'">
                <div class="card-title">${canal.nombre}</div>
                <div class="card-stats">
                    <span class="stars">★ ${canal.ratingPromedio || '0.0'}</span>
                    <span> ${canal.visitas || 0}</span>
                </div>
            `;
            card.onclick = () => abrirCanal(canal);
            return card;
        }

        async function cargarRatings() {
            const ratingsSnapshot = await db.collection("ratings").get();
            const ratingsPorCanal = {};
            ratingsSnapshot.forEach(doc => {
                const data = doc.data();
                if (!ratingsPorCanal[data.canalId]) ratingsPorCanal[data.canalId] = [];
                ratingsPorCanal[data.canalId].push(data.rating);
            });
            return ratingsPorCanal;
        }

        function calcularPromedio(ratings) {
            if (ratings.length === 0) return '0.0';
            return (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1);
        }

        db.collection("canales").onSnapshot(async (snapshot) => {
            todosLosCanales = [];
            snapshot.forEach((doc) => todosLosCanales.push({ id: doc.id, ...doc.data() }));
            const ratings = await cargarRatings();
            todosLosCanales.forEach(canal => { canal.ratingPromedio = calcularPromedio(ratings[canal.id] || []); });
            renderizarCanales(todosLosCanales);
            renderizarFavoritos();
        });

        function renderizarCanales(canales) {
            const contenedor = document.getElementById('contenedor');
            contenedor.innerHTML = '';
            if (canales.length === 0) { document.getElementById('noResults').style.display = 'block'; return; }
            document.getElementById('noResults').style.display = 'none';
            const agrupados = {};
            canales.forEach(canal => {
                const cat = canal.categoria || 'Default';
                if (!agrupados[cat]) agrupados[cat] = [];
                agrupados[cat].push(canal);
            });
            for (const [categoria, lista] of Object.entries(agrupados)) {
                const secDiv = document.createElement('div');
                secDiv.className = 'seccion';
                secDiv.innerHTML = `<h2 class="seccion-titulo"><span>${iconosCategorias[categoria] || '📡'}</span> ${categoria}</h2>`;
                const grid = document.createElement('div');
                grid.className = 'grid';
                lista.forEach(canal => grid.appendChild(crearCard(canal)));
                secDiv.appendChild(grid);
                contenedor.appendChild(secDiv);
            }
        }

        function filtrarCanales() {
            const texto = document.getElementById('buscador').value.toLowerCase().trim();
            renderizarCanales(todosLosCanales.filter(c => c.nombre.toLowerCase().includes(texto)));
        }

        async function abrirCanal(canal) {
            canalActual = canal;
            db.collection("canales").doc(canal.id).update({ visitas: (canal.visitas || 0) + 1 });
            document.getElementById('modalTitulo').textContent = `▶ ${canal.nombre}`;
            document.getElementById('playerFrame').src = canal.url;
            document.getElementById('externalLink').href = canal.url;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
            
            const userId = localStorage.getItem('nubaraPlayUserId') || 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('nubaraPlayUserId', userId);
            const userRating = await db.collection("ratings").where("canalId", "==", canal.id).where("userId", "==", userId).get();
            let ratingActual = 0;
            if (!userRating.empty) ratingActual = userRating.docs[0].data().rating;
            actualizarEstrellasVisuales(ratingActual);
        }

        function actualizarEstrellasVisuales(rating) {
            document.querySelectorAll('#ratingStars .star').forEach((star, index) => {
                star.classList.toggle('active', index < rating);
            });
            const textos = ['', 'Muy malo', 'Malo', 'Regular', 'Bueno', 'Excelente'];
            document.getElementById('ratingText').textContent = rating > 0 ? `Tu calificación: ${rating}/5 - ${textos[rating]}` : 'Haz clic en una estrella para calificar';
        }

        document.querySelectorAll('#ratingStars .star').forEach(star => {
            star.addEventListener('click', async () => {
                if (!canalActual) return;
                const rating = parseInt(star.getAttribute('data-rating'));
                const userId = localStorage.getItem('nubaraPlayUserId');
                actualizarEstrellasVisuales(rating);
                const existingRating = await db.collection("ratings").where("canalId", "==", canalActual.id).where("userId", "==", userId).get();
                if (!existingRating.empty) {
                    db.collection("ratings").doc(existingRating.docs[0].id).update({ rating, fecha: new Date() });
                } else {
                    db.collection("ratings").add({ canalId: canalActual.id, userId, rating, fecha: new Date() });
                }
            });
        });

        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('playerFrame').src = '';
            document.body.style.overflow = 'auto';
            canalActual = null;
        }
        function cerrarModalFuera(event) { if (event.target.id === 'modal') cerrarModal(); }
    </script>
</body>
</html>
