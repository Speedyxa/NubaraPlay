<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 NubaraPlay - TV Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0c; color: #fff; min-height: 100vh; }
        header { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        header h1 { font-size: 2em; background: linear-gradient(90deg, #e50914, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .search-box { max-width: 500px; margin: 15px auto 0; }
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid #333; background: #1a1a1e; color: #fff; font-size: 1em; outline: none; }
        .search-box input:focus { border-color: #e50914; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .seccion { margin-bottom: 40px; }
        .seccion-titulo { font-size: 1.4em; color: #fff; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e50914; display: flex; align-items: center; gap: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: #16161a; border-radius: 12px; overflow: hidden; transition: all 0.3s; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .card:hover { transform: translateY(-5px); border-color: #e50914; box-shadow: 0 10px 25px rgba(229, 9, 20, 0.2); }
        .card img { width: 100%; height: 100px; object-fit: contain; background: #000; padding: 15px; }
        .card-title { padding: 12px; text-align: center; font-weight: 600; font-size: 0.9em; color: #ddd; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { width: 100%; max-width: 900px; background: #111; border-radius: 12px; overflow: hidden; }
        .modal-content iframe { width: 100%; aspect-ratio: 16/9; border: none; background: #000; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1a1a1e; }
        .modal-header h3 { color: #e50914; }
        .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; border: none; text-decoration: none; display: inline-flex; gap: 5px; }
        .btn-external { background: #2a2a2e; color: #fff; }
        .btn-close { background: #e50914; color: white; }
        .no-results { text-align: center; color: #666; padding: 40px; display: none; }
        .loading { text-align: center; padding: 50px; color: #e50914; font-size: 1.2em; }
    </style>
</head>
<body>
    <header>
        <h1>📺 NubaraPlay</h1>
        <div class="search-box">
            <input type="text" id="buscador" placeholder="🔍 Buscar canal..." onkeyup="filtrarCanales()">
        </div>
    </header>
    <div class="container" id="contenedor">
        <div class="loading">⏳ Cargando canales desde la nube...</div>
    </div>
    <div class="no-results" id="noResults">😕 No se encontraron canales.</div>

    <div class="modal" id="modal" onclick="cerrarModalFuera(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitulo">Cargando...</h3>
                <div style="display: flex; gap: 10px;">
                    <a href="#" id="externalLink" target="_blank" class="btn btn-external">🔗 Abrir fuera</a>
                    <button class="btn btn-close" onclick="cerrarModal()">✖ Cerrar</button>
                </div>
            </div>
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",
          authDomain: "nubaraplay.firebaseapp.com",
          projectId: "nubaraplay",
          storageBucket: "nubaraplay.firebasestorage.app",
          messagingSenderId: "873822057409",
          appId: "1:873822057409:web:f854a974f457eedd0c7540"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let todosLosCanales = [];
        const iconosCategorias = { 'Deportes': '⚽', 'Noticias': '📰', 'Entretenimiento': '📺', 'Peliculas': '🎬', 'Musica': '🎵', 'Default': '📡' };

        db.collection("canales").onSnapshot((snapshot) => {
            todosLosCanales = [];
            snapshot.forEach((doc) => { todosLosCanales.push({ id: doc.id, ...doc.data() }); });
            renderizarCanales(todosLosCanales);
        });

        function renderizarCanales(canales) {
            const contenedor = document.getElementById('contenedor');
            contenedor.innerHTML = '';
            if (canales.length === 0) { document.getElementById('noResults').style.display = 'block'; return; }
            document.getElementById('noResults').style.display = 'none';
            const agrupados = {};
            canales.forEach(canal => {
                const cat = canal.categoria || 'Default';
                if (!agrupados[cat]) agrupados[cat] = [];
                agrupados[cat].push(canal);
            });
            for (const [categoria, lista] of Object.entries(agrupados)) {
                const secDiv = document.createElement('div');
                secDiv.className = 'seccion';
                secDiv.innerHTML = `<h2 class="seccion-titulo"><span>${iconosCategorias[categoria] || iconosCategorias['Default']}</span> ${categoria}</h2>`;
                const grid = document.createElement('div');
                grid.className = 'grid';
                lista.forEach(canal => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-nombre', canal.nombre.toLowerCase());
                    card.innerHTML = `<img src="${canal.logo}" alt="${canal.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x120/1a1a1e/fff?text=TV'"><div class="card-title">${canal.nombre}</div>`;
                    card.onclick = () => abrirCanal(canal);
                    grid.appendChild(card);
                });
                secDiv.appendChild(grid);
                contenedor.appendChild(secDiv);
            }
        }
        function filtrarCanales() {
            const texto = document.getElementById('buscador').value.toLowerCase().trim();
            const filtrados = todosLosCanales.filter(c => c.nombre.toLowerCase().includes(texto));
            renderizarCanales(filtrados);
        }
        function abrirCanal(canal) {
            document.getElementById('modalTitulo').textContent = `▶ ${canal.nombre}`;
            document.getElementById('playerFrame').src = canal.url;
            document.getElementById('externalLink').href = canal.url;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('playerFrame').src = '';
            document.body.style.overflow = 'auto';
        }
        function cerrarModalFuera(event) {
            if (event.target.id === 'modal') cerrarModal();
        }
    </script>
</body>
</html>
