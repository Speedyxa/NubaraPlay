<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 NubaraPlay - TV Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0c;
            color: #fff;
            min-height: 100vh;
        }
        
        /* Header con efecto cristal */
        header {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        header h1 {
            font-size: 2em;
            background: linear-gradient(90deg, #e50914, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        header p { color: #888; margin-top: 5px; font-size: 0.9em; }
        
        /* Buscador */
        .search-box {
            max-width: 500px;
            margin: 15px auto 0;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background: #1a1a1e;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            border-color: #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* Secciones */
        .seccion { margin-bottom: 40px; }
        .seccion-titulo {
            font-size: 1.4em;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e50914;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .card {
            background: #16161a;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #e50914;
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.2);
        }
        .card img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            background: #000;
            padding: 15px;
        }
        .card-title {
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
            color: #ddd;
        }
        
        /* Modal mejorado */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            width: 100%;
            max-width: 900px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        .modal-content iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            background: #000;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1a1a1e;
            border-bottom: 1px solid #333;
        }
        .modal-header h3 { color: #e50914; font-size: 1.1em; }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .btn-external { background: #2a2a2e; color: #fff; }
        .btn-external:hover { background: #3a3a3e; }
        .btn-close { background: #e50914; color: white; }
        .btn-close:hover { background: #ff1f2c; }
        
        /* Mensaje cuando no hay resultados */
        .no-results {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 1.1em;
            display: none;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
            .card img { height: 80px; padding: 10px; }
            .modal-header { flex-direction: column; gap: 10px; text-align: center; }
            .modal-header h3 { font-size: 1em; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 NubaraPlay</h1>
        <p>TV Online - Canales en vivo</p>
        <div class="search-box">
            <input type="text" id="buscador" placeholder="🔍 Buscar canal (ej: TUDN, CNN)..." onkeyup="filtrarCanales()">
        </div>
    </header>

    <div class="container" id="contenedor"></div>
    <div class="no-results" id="noResults">😕 No se encontraron canales con ese nombre.</div>

    <!-- Modal Reproductor (Se cierra al hacer clic fuera) -->
    <div class="modal" id="modal" onclick="cerrarModalFuera(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitulo">Cargando canal...</h3>
                <div style="display: flex; gap: 10px;">
                    <a href="#" id="externalLink" target="_blank" class="btn btn-external">🔗 Abrir fuera</a>
                    <button class="btn btn-close" onclick="cerrarModal()">✖ Cerrar</button>
                </div>
            </div>
            <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <script>
        // =====================================================
        // 📝 CANALES ORGANIZADOS POR SECCIONES (CORREGIDO)
        // =====================================================
        const secciones = [
            {
                nombre: "⚽ Deportes",
                icono: "⚽",
                canales: [
                    {
                        nombre: "TUDN US",
                        logo: "https://cdn.aptoide.com/imgs/e/e/6/ee65573e3ed2c5fcafa0191860afdf51_fgraphic.png",
                        url: "https://la18hd.su/vivo/canales.php?stream=tudn"
                    },
                    {
                        nombre: "Fox Sports",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Fox_Sports_2019.svg/320px-Fox_Sports_2019.svg.png",
                        url: "https://la18hd.su/vivo/canales.php?stream=foxsports" 
                    }
                ]
            },
            {
                nombre: "📰 Noticias",
                icono: "📰",
                canales: [
                    {
                        nombre: "CNN en Español",
                        logo: "https://www.cxtv.com.br/img/Tvs/Logo/webp-m/47f99fa1872d0b6c8d1c562b94bfeb31.webp",
                        url: "https://amg00803-cnnfast-amg00803c3-lg-es-5477.playouts.now.amagi.tv/playlist1080p.m3u8"
                    }
                ]
            },
            {
                nombre: "📺 Entretenimiento",
                icono: "📺",
                canales: [
                    {
                        nombre: "Universo",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Logo_Univision_Universo.svg/320px-Logo_Univision_Universo.svg.png",
                        url: "https://la18hd.su/vivo/canales.php?stream=universo"
                    },
                    {
                        nombre: "Unimas",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/UniMas_logo.svg/320px-UniMas_logo.svg.png",
                        url: "https://la18hd.su/vivo/canales.php?stream=unimas"
                    },
                    {
                        nombre: "Univision",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Univision_logo_2019.svg/320px-Univision_logo_2019.svg.png",
                        url: "https://la18hd.su/vivo/canales.php?stream=univision"
                    }
                ]
            },
            {
                nombre: "🎬 Películas y Series",
                icono: "🎬",
                canales: [
                    {
                        nombre: "Cine Premium",
                        logo: "https://via.placeholder.com/200x120/e50914/fff?text=CINE+HD",
                        url: "https://ejemplo.com/cine.php"
                    }
                ]
            }
        ];
        // =====================================================

        const contenedor = document.getElementById('contenedor');
        const modal = document.getElementById('modal');
        const iframe = document.getElementById('playerFrame');
        const titulo = document.getElementById('modalTitulo');
        const extLink = document.getElementById('externalLink');
        const noResults = document.getElementById('noResults');

        // Generar secciones y canales
        function renderizarCanales() {
            contenedor.innerHTML = '';
            let totalCanalesVisibles = 0;

            secciones.forEach(seccion => {
                const secDiv = document.createElement('div');
                secDiv.className = 'seccion';
                
                const tituloSec = document.createElement('h2');
                tituloSec.className = 'seccion-titulo';
                tituloSec.innerHTML = `<span>${seccion.icono}</span> ${seccion.nombre}`;
                secDiv.appendChild(tituloSec);
                
                const grid = document.createElement('div');
                grid.className = 'grid';
                let canalesEnEstaSeccion = 0;
                
                seccion.canales.forEach(canal => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-nombre', canal.nombre.toLowerCase());
                    card.innerHTML = `
                        <img src="${canal.logo}" alt="${canal.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x120/1a1a1e/fff?text=TV'">
                        <div class="card-title">${canal.nombre}</div>
                    `;
                    card.onclick = () => abrirCanal(canal);
                    grid.appendChild(card);
                    canalesEnEstaSeccion++;
                    totalCanalesVisibles++;
                });
                
                if (canalesEnEstaSeccion > 0) {
                    secDiv.appendChild(grid);
                    contenedor.appendChild(secDiv);
                }
            });

            // Mostrar u ocultar mensaje de "no resultados"
            noResults.style.display = totalCanalesVisibles === 0 ? 'block' : 'none';
        }

        // Función de búsqueda
        function filtrarCanales() {
            const texto = document.getElementById('buscador').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.card');
            const seccionesDivs = document.querySelectorAll('.seccion');
            let visibles = 0;

            cards.forEach(card => {
                const nombre = card.getAttribute('data-nombre');
                if (nombre.includes(texto)) {
                    card.style.display = 'block';
                    visibles++;
                } else {
                    card.style.display = 'none';
                }
            });

            // Ocultar títulos de sección si no tienen canales visibles
            seccionesDivs.forEach(sec => {
                const cardsVisibles = sec.querySelectorAll('.card[style="display: block;"]');
                sec.style.display = cardsVisibles.length > 0 ? 'block' : 'none';
            });

            noResults.style.display = visibles === 0 ? 'block' : 'none';
        }

        // Abrir reproductor
        function abrirCanal(canal) {
            titulo.textContent = `▶ ${canal.nombre}`;
            iframe.src = canal.url;
            extLink.href = canal.url;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Evita scroll de fondo
        }

        // Cerrar reproductor
        function cerrarModal() {
            modal.classList.remove('active');
            iframe.src = ''; // Detiene la carga y el audio
            document.body.style.overflow = 'auto'; // Restaura scroll
        }

        // Cerrar al hacer clic fuera del contenido del modal
        function cerrarModalFuera(event) {
            if (event.target === modal) {
                cerrarModal();
            }
        }

        // Inicializar
        renderizarCanales();
    </script>

</body>
</html>
