<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 NubaraPlay - TV Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f13;
            color: #fff;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #141414, #2a0845);
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 2.2em;
            color: #e50914;
            letter-spacing: 1px;
        }
        header p { color: #aaa; margin-top: 5px; }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* Secciones */
        .seccion {
            margin-bottom: 40px;
        }
        .seccion-titulo {
            font-size: 1.5em;
            color: #e50914;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .seccion-titulo span {
            font-size: 1.2em;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1f1f23;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #333;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #e50914;
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.4);
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background: #000;
            padding: 10px;
        }
        .card-title {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95em;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal.active { display: flex; }
        .modal-content {
            width: 90%;
            max-width: 900px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        .modal-content iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #1a1a1a;
        }
        .modal-header h3 { color: #e50914; }
        .btn {
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            text-decoration: none;
            display: inline-block;
            margin-left: 10px;
        }
        .btn-external { background: #333; color: white; }
        .btn-close { background: #e50914; color: white; }
        
        @media (max-width: 600px) {
            .modal-content iframe { height: 250px; }
            header h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 NubaraPlay</h1>
        <p>TV Online - Canales en vivo</p>
    </header>

    <div class="container" id="contenedor"></div>

    <!-- Modal Reproductor -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitulo">Canal</h3>
                <div>
                    <a href="#" id="externalLink" target="_blank" class="btn btn-external">🔗 Abrir fuera</a>
                    <button class="btn btn-close" onclick="cerrarModal()">✖ Cerrar</button>
                </div>
            </div>
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // =====================================================
        // 📝 EDITA AQUÍ TUS CANALES ORGANIZADOS POR SECCIONES
        // =====================================================
        const secciones = [
            {
                nombre: "⚽ Deportes",
                icono: "⚽",
                canales: [
                    {
                        nombre: "TUDN US",
                        logo: "https://cdn.aptoide.com/imgs/e/e/6/ee65573e3ed2c5fcafa0191860afdf51_fgraphic.png",
                        url: "https://la18hd.su/vivo/canales.php?stream=tudn"
                    },
                    {
                        nombre: "Fox Sports",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Fox_Sports_2019.svg/320px-Fox_Sports_2019.svg.png",
                        url: "https://ejemplo.com/foxsports.php"
                    }
                ]
            },
            {
                nombre: "📰 Noticias",
                icono: "📰",
                canales: [
                    {
                        nombre: "CNN en Español",
                        logo: "https://www.cxtv.com.br/img/Tvs/Logo/webp-m/47f99fa1872d0b6c8d1c562b94bfeb31.webp",
                        url: "https://amg00803-cnnfast-amg00803c3-lg-es-5477.playouts.now.amagi.tv/playlist1080p.m3u8"
                    },
                    {
                        nombre: "BBC World",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/BBC_World_News_2022_%28Print%29.svg/320px-BBC_World_News_2022_%28Print%29.svg.png",
                        url: "https://ejemplo.com/bbc.html"
                    }
                ]
            },
            {
                nombre: "🎬 Películas",
                icono: "🎬",
                canales: [
                    {
                        nombre: "HBO",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/HBO_logo.svg/320px-HBO_logo.svg.png",
                        url: "https://ejemplo.com/hbo.php"
                    },
                    {
                        nombre: "Cine Premium",
                        logo: "https://via.placeholder.com/200x120/e50914/fff?text=CINE",
                        url: "https://ejemplo.com/cine.php"
                    }
                ]
            },
            {
                nombre: "🎵 Música",
                icono: "🎵",
                canales: [
                    {
                        nombre: "MTV",
                        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/MTV_2021_%28brand_version%29.svg/320px-MTV_2021_%28brand_version%29.svg.png",
                        url: "https://ejemplo.com/mtv.php"
                    }
                ]
            }
            // 👉 Copia un bloque completo { } para añadir más secciones
        ];
        // =====================================================

        const contenedor = document.getElementById('contenedor');
        const modal = document.getElementById('modal');
        const iframe = document.getElementById('playerFrame');
        const titulo = document.getElementById('modalTitulo');
        const extLink = document.getElementById('externalLink');

        // Generar secciones y canales
        secciones.forEach(seccion => {
            const secDiv = document.createElement('div');
            secDiv.className = 'seccion';
            
            const tituloSec = document.createElement('h2');
            tituloSec.className = 'seccion-titulo';
            tituloSec.innerHTML = `<span>${seccion.icono}</span> ${seccion.nombre}`;
            secDiv.appendChild(tituloSec);
            
            const grid = document.createElement('div');
            grid.className = 'grid';
            
            seccion.canales.forEach(canal => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${canal.logo}" alt="${canal.nombre}" onerror="this.src='https://via.placeholder.com/200x120/000/fff?text=TV'">
                    <div class="card-title">${canal.nombre}</div>
                `;
                card.onclick = () => abrirCanal(canal);
                grid.appendChild(card);
            });
            
            secDiv.appendChild(grid);
            contenedor.appendChild(secDiv);
        });

        function abrirCanal(canal) {
            titulo.textContent = canal.nombre;
            iframe.src = canal.url;
            extLink.href = canal.url;
            modal.classList.add('active');
        }

        function cerrarModal() {
            modal.classList.remove('active');
            iframe.src = '';
        }
    </script>

</body>
</html>
