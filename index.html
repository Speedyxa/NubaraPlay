<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 TV Online - Canales en Vivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f13;
            color: #fff;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #141414, #2a0845);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        header h1 {
            font-size: 2em;
            color: #e50914;
            letter-spacing: 1px;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1f1f23;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #333;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #e50914;
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.4);
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background: #000;
            padding: 10px;
        }
        .card-title {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95em;
        }
        
        /* Modal / Reproductor */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal.active { display: flex; }
        .modal-content {
            width: 90%;
            max-width: 900px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .modal-content iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1a1a1a;
        }
        .close-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .external-btn {
            background: #333;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        @media (max-width: 600px) {
            .modal-content iframe { height: 250px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 TV ONLINE</h1>
        <p style="color: #aaa; margin-top: 5px;">Selecciona un canal para ver en vivo</p>
    </header>

    <div class="container">
        <div class="grid" id="canalGrid"></div>
    </div>

    <!-- Modal Reproductor -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitulo" style="color: #e50914;">Nombre del Canal</h3>
                <div>
                    <a href="#" id="externalLink" target="_blank" class="external-btn">🔗 Abrir en nueva pestaña</a>
                    <button class="close-btn" onclick="cerrarModal()">✖ Cerrar</button>
                </div>
            </div>
            <!-- Aquí se carga el .php o .html -->
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // =====================================================
        // 📝 EDITA AQUÍ TUS CANALES
        // Solo cambia: nombre, logo y url (puede ser .php o .html)
        // =====================================================
        const canales = [
            {
                nombre: "Canal 1 - Noticias",
                logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Flag_of_Italy.svg/320px-Flag_of_Italy.svg.png",
                url: "https://dlive.sx/stream/stream-399.php" 
            },
            {
                nombre: "Canal 2 - Deportes",
                logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Flag_of_Spain.svg/320px-Flag_of_Spain.svg.png",
                url: "https://ejemplo.com/canal2.html"
            },
            {
                nombre: "Canal 3 - Películas",
                logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Flag_of_France.svg/320px-Flag_of_France.svg.png",
                url: "https://ejemplo.com/peliculas.php"
            }
            // 👉 Copia y pega un bloque { } para añadir más canales
        ];
        // =====================================================

        const grid = document.getElementById('canalGrid');
        const modal = document.getElementById('modal');
        const iframe = document.getElementById('playerFrame');
        const titulo = document.getElementById('modalTitulo');
        const extLink = document.getElementById('externalLink');

        // Generar las tarjetas
        canales.forEach(canal => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${canal.logo}" alt="${canal.nombre}" onerror="this.src='https://via.placeholder.com/200x120/000/fff?text=TV'">
                <div class="card-title">${canal.nombre}</div>
            `;
            card.onclick = () => abrirCanal(canal);
            grid.appendChild(card);
        });

        // Abrir el reproductor
        function abrirCanal(canal) {
            titulo.textContent = canal.nombre;
            iframe.src = canal.url; // Carga el .php o .html en el iframe
            extLink.href = canal.url; // Botón de respaldo por si falla el iframe
            modal.classList.add('active');
        }

        // Cerrar el reproductor
        function cerrarModal() {
            modal.classList.remove('active');
            iframe.src = ''; // Detiene la carga del video
        }
    </script>

</body>
</html>
