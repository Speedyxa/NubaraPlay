<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas - NubaraPlay</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #141414; color: #fff; min-height: 100vh; }

        .navbar { position: fixed; top: 0; width: 100%; padding: 20px 4%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: #141414; }
        .navbar-left { display: flex; align-items: center; gap: 25px; }
        .logo { color: #e50914; font-size: 28px; font-weight: bold; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: #e5e5e5; text-decoration: none; font-size: 14px; cursor: pointer; }
        .nav-links a:hover { color: #b3b3b3; }
        .navbar-right { display: flex; align-items: center; gap: 20px; }
        .user-info { background: #e50914; padding: 5px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .logout-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 7px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }

        .category-hero { padding: 120px 4% 40px; background: linear-gradient(to bottom, rgba(229,9,20,0.3), #141414); }
        .category-title { font-size: 48px; font-weight: 700; margin-bottom: 10px; }
        .category-count { color: #808080; font-size: 16px; }

        .content-section { padding: 20px 4%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

        .card { border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; position: relative; background: #181818; }
        .card:hover { transform: scale(1.05); z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .card img { width: 100%; height: 270px; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .card-info { font-size: 12px; color: #808080; display: flex; justify-content: space-between; }
        .card-rating { color: #ffd700; }
        .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; }
        .fav-btn.active { color: #ffd700; }

        .no-results { text-align: center; padding: 60px 20px; color: #808080; font-size: 20px; }

        @media (max-width: 768px) {
            .category-title { font-size: 32px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
            .card img { height: 180px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo">NUBARAPLAY</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="categoria.html?cat=Deportes">Deportes</a></li>
                <li><a href="categoria.html?cat=Noticias">Noticias</a></li>
                <li><a href="categoria.html?cat=Entretenimiento">Entretenimiento</a></li>
                <li><a href="genero.html">Películas</a></li>
            </ul>
        </div>
        <div class="navbar-right">
            <span class="user-info" id="userInfo">Usuario</span>
            <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
        </div>
    </nav>

    <div class="category-hero">
        <h1 class="category-title">🎬 Películas</h1>
        <p class="category-count" id="categoryCount">0 películas disponibles</p>
    </div>

    <div class="content-section">
        <div class="grid" id="gridPeliculas"></div>
        <div class="no-results" id="noResults" style="display: none;">No hay películas disponibles</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",
            authDomain: "nubaraplay.firebaseapp.com",
            projectId: "nubaraplay",
            storageBucket: "nubaraplay.firebasestorage.app",
            messagingSenderId: "873822057409",
            appId: "1:873822057409:web:f854a974f457eedd0c7540"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('userInfo').textContent = localStorage.getItem('nubaraPlayUser') ? `${JSON.parse(localStorage.getItem('nubaraPlayUser')).nombre}` : 'Usuario';

        function cerrarSesion() { localStorage.removeItem('nubaraPlayUser'); localStorage.removeItem('nubaraPlayUserExpiry'); window.location.href = 'index.html'; }

        db.collection("peliculas").orderBy("fecha", "desc").onSnapshot((snapshot) => {
            const grid = document.getElementById('gridPeliculas');
            grid.innerHTML = '';
            document.getElementById('categoryCount').textContent = `${snapshot.size} películas disponibles`;

            if (snapshot.empty) {
                document.getElementById('noResults').style.display = 'block';
                return;
            }

            snapshot.forEach((doc) => {
                const peli = doc.data();
                const favoritos = JSON.parse(localStorage.getItem('nubaraPlayFavoritos') || '[]');
                const esFav = favoritos.includes(doc.id);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${peli.logo}" alt="${peli.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/180x270/141414/fff?text=Movie'">
                    <button class="fav-btn ${esFav ? 'active' : ''}" onclick="toggleFavorito('${doc.id}', event)">${esFav ? '★' : '☆'}</button>
                    <div class="card-body">
                        <div class="card-title">${peli.nombre}</div>
                        <div class="card-info">
                            <span>${peli.anio || 'N/A'}</span>
                            <span class="card-rating">⭐ ${peli.rating || '0'}</span>
                        </div>
                    </div>
                `;
                card.onclick = (e) => {
                    if (!e.target.classList.contains('fav-btn')) {
                        window.location.href = `detalle.html?id=${doc.id}`;
                    }
                };
                grid.appendChild(card);
            });
        });

        function toggleFavorito(id, event) {
            event.stopPropagation();
            let favoritos = JSON.parse(localStorage.getItem('nubaraPlayFavoritos') || '[]');
            const index = favoritos.indexOf(id);
            if (index > -1) favoritos.splice(index, 1); else favoritos.push(id);
            localStorage.setItem('nubaraPlayFavoritos', JSON.stringify(favoritos));
            location.reload();
        }
    </script>
</body>
</html>
