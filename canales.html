<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canales - NubaraPlay</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <style>
    .light-mode { background-color: #f4f6f9; }
    .light-mode .content-wrapper { background-color: #f4f6f9; }
    .light-mode .card { background-color: #fff; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <a href="#" class="navbar-brand"><span class="brand-text font-weight-bold">📺 NubaraPlay</span></a>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" href="#" onclick="toggleDarkMode()" role="button"><i class="fas fa-moon" id="darkModeIcon"></i></a></li>
      <li class="nav-item"><a class="nav-link" href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Web</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="cerrarSesionAdmin()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="admin.html" class="brand-link"><span class="brand-text font-weight-light">Panel Admin</span></a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="admin.html" class="nav-link"><i class="nav-icon fas fa-chart-line"></i><p>Dashboard</p></a></li>
          <li class="nav-item"><a href="canales.html" class="nav-link active"><i class="nav-icon fas fa-tv"></i><p>Canales TV</p></a></li>
          <li class="nav-item"><a href="peliculas.html" class="nav-link"><i class="nav-icon fas fa-film"></i><p>Películas TMDB</p></a></li>
          <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="nav-icon fas fa-users"></i><p>Usuarios</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><h1 class="m-0">📺 Gestión de Canales de TV</h1></div></div>
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-4">
            <div class="card card-danger">
              <div class="card-header"><h3 class="card-title" id="formTitle">➕ Agregar Canal</h3></div>
              <div class="card-body">
                <input type="hidden" id="channelId">
                <div class="form-group">
                  <label><i class="fas fa-tv"></i> Nombre del Canal</label>
                  <input type="text" id="nombre" class="form-control" placeholder="Ej: TUDN, ESPN, CNN">
                </div>
                <div class="form-group">
                  <label><i class="fas fa-image"></i> URL del Logo</label>
                  <input type="text" id="logo" class="form-control" placeholder="https://...">
                </div>
                <div class="form-group">
                  <label><i class="fas fa-link"></i> URL del Stream</label>
                  <input type="text" id="url" class="form-control" placeholder="https://...">
                </div>
                
                <!-- ✅ CAMBIO CLAVE: Input de texto con sugerencias en lugar de select fijo -->
                <div class="form-group">
                  <label><i class="fas fa-folder"></i> Categoría (Escribe una nueva o selecciona)</label>
                  <input type="text" id="categoria" class="form-control" list="categoriasSugeridas" placeholder="Ej: Deportes, Noticias, Cine, Infantil...">
                  <datalist id="categoriasSugeridas">
                    <option value="Deportes">
                    <option value="Noticias">
                    <option value="Entretenimiento">
                    <option value="Musica">
                    <option value="Infantil">
                    <option value="Cine">
                    <option value="Documentales">
                    <option value="Variedades">
                  </datalist>
                  <small class="text-muted">Puedes escribir cualquier nombre de categoría nuevo.</small>
                </div>

                <button onclick="guardarCanal()" class="btn btn-success btn-block">
                  <i class="fas fa-save" id="btnIcon"></i> <span id="btnText">Guardar</span>
                </button>
                <button onclick="limpiarForm()" class="btn btn-secondary btn-block mt-2">
                  <i class="fas fa-times"></i> Limpiar
                </button>
              </div>
            </div>
          </div>

          <div class="col-md-8">
            <div class="card card-primary">
              <div class="card-header"><h3 class="card-title">Canales Existentes</h3></div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead>
                      <tr>
                        <th style="width: 60px">Logo</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th style="width: 150px">Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="tablaCanales">
                      <tr><td colspan="4" class="text-center">Cargando...</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<script>
  verificarAdmin();
  let canalesLocales = [];

  function toggleDarkMode() {
    const body = document.body;
    const icon = document.getElementById('darkModeIcon');
    const navbar = document.querySelector('.main-header');
    const sidebar = document.querySelector('.main-sidebar');
    if (body.classList.contains('dark-mode')) {
      body.classList.remove('dark-mode'); body.classList.add('light-mode');
      navbar.classList.remove('navbar-dark'); navbar.classList.add('navbar-white', 'navbar-light');
      sidebar.classList.remove('sidebar-dark-primary'); sidebar.classList.add('sidebar-light-primary');
      localStorage.setItem('nubaraPlayTheme', 'light'); icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
    } else {
      body.classList.add('dark-mode'); body.classList.remove('light-mode');
      navbar.classList.remove('navbar-white', 'navbar-light'); navbar.classList.add('navbar-dark');
      sidebar.classList.remove('sidebar-light-primary'); sidebar.classList.add('sidebar-dark-primary');
      localStorage.setItem('nubaraPlayTheme', 'dark'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
    }
  }

  function loadSavedTheme() {
    const savedTheme = localStorage.getItem('nubaraPlayTheme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      document.querySelector('.main-header').classList.remove('navbar-white', 'navbar-light');
      document.querySelector('.main-header').classList.add('navbar-dark');
      document.querySelector('.main-sidebar').classList.remove('sidebar-light-primary');
      document.querySelector('.main-sidebar').classList.add('sidebar-dark-primary');
      document.getElementById('darkModeIcon').classList.remove('fa-moon');
      document.getElementById('darkModeIcon').classList.add('fa-sun');
    }
  }

  function cargarCanales() {
    db.collection("canales").onSnapshot((snapshot) => {
      canalesLocales = [];
      const tbody = document.getElementById('tablaCanales');
      tbody.innerHTML = '';
      
      if (snapshot.empty) { 
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">No hay canales</td></tr>'; 
        return; 
      }
      
      snapshot.forEach((doc) => {
        const canal = doc.data();
        if (canal.categoria === 'Peliculas') return; // Ignorar películas en esta tabla
        
        canalesLocales.push({ id: doc.id, ...canal });
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${canal.logo}" width="40" height="40" style="object-fit:contain; background:#000; border-radius:4px;" onerror="this.src='https://via.placeholder.com/40'"></td>
          <td><strong>${canal.nombre}</strong></td>
          <td><span class="badge badge-info">${canal.categoria || 'Sin categoría'}</span></td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="editarCanal('${doc.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger" onclick="borrarCanal('${doc.id}')"><i class="fas fa-trash"></i></button>
          </td>`;
        tbody.appendChild(tr);
      });
    });
  }

  function editarCanal(id) {
    const canal = canalesLocales.find(c => c.id === id);
    if (!canal) {
      Swal.fire('Error', 'No se encontró el canal', 'error');
      return;
    }
    
    // Cargar datos en el formulario
    document.getElementById('channelId').value = canal.id;
    document.getElementById('nombre').value = canal.nombre;
    document.getElementById('logo').value = canal.logo;
    document.getElementById('url').value = canal.url;
    document.getElementById('categoria').value = canal.categoria || ''; // ✅ Carga la categoría para editarla
    
    // Cambiar UI a modo edición
    document.getElementById('formTitle').innerHTML = '✏️ Editar Canal';
    document.getElementById('btnText').textContent = 'Actualizar';
    document.getElementById('btnIcon').className = 'fas fa-sync';
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function guardarCanal() {
    const id = document.getElementById('channelId').value;
    const data = {
      nombre: document.getElementById('nombre').value.trim(),
      logo: document.getElementById('logo').value.trim(),
      url: document.getElementById('url').value.trim(),
      categoria: document.getElementById('categoria').value.trim() || 'General', // ✅ Guarda la categoría escrita
      fecha: new Date()
    };
    
    if (!data.nombre || !data.url) {
      return Swal.fire('Error', 'Nombre y URL son obligatorios', 'error');
    }
    
    try {
      if (id) {
        // Actualizar existente
        await db.collection("canales").doc(id).update(data);
        Swal.fire('¡Actualizado!', 'Canal actualizado correctamente', 'success');
      } else {
        // Crear nuevo
        data.visitas = 0;
        await db.collection("canales").add(data);
        Swal.fire('¡Éxito!', 'Canal guardado correctamente', 'success');
      }
      limpiarForm();
    } catch (error) {
      Swal.fire('Error', 'No se pudo guardar: ' + error.message, 'error');
    }
  }

  function borrarCanal(id) {
    Swal.fire({ 
      title: '¿Eliminar canal?', 
      icon: 'warning', 
      showCancelButton: true, 
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then((r) => {
      if (r.isConfirmed) {
        db.collection("canales").doc(id).delete();
        Swal.fire('Eliminado', 'El canal ha sido eliminado', 'success');
      }
    });
  }

  function limpiarForm() {
    document.getElementById('channelId').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('logo').value = '';
    document.getElementById('url').value = '';
    document.getElementById('categoria').value = ''; // ✅ Limpia la categoría
    document.getElementById('formTitle').innerHTML = '➕ Agregar Canal';
    document.getElementById('btnText').textContent = 'Guardar';
    document.getElementById('btnIcon').className = 'fas fa-save';
  }

  loadSavedTheme();
  cargarCanales();
</script>
</body>
</html>
