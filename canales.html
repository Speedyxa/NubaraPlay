<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canales - NubaraPlay</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <a href="#" class="navbar-brand"><span class="brand-text font-weight-bold">📺 NubaraPlay</span></a>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Web</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="cerrarSesionAdmin()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="admin.html" class="brand-link"><span class="brand-text font-weight-light">Panel Admin</span></a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="admin.html" class="nav-link"><i class="nav-icon fas fa-chart-line"></i><p>Dashboard</p></a></li>
          <li class="nav-item"><a href="canales.html" class="nav-link active"><i class="nav-icon fas fa-tv"></i><p>Canales TV</p></a></li>
          <li class="nav-item"><a href="peliculas.html" class="nav-link"><i class="nav-icon fas fa-film"></i><p>Películas TMDB</p></a></li>
          <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="nav-icon fas fa-users"></i><p>Usuarios</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><h1 class="m-0">📺 Gestión de Canales de TV</h1></div></div>
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-4">
            <div class="card card-danger">
              <div class="card-header"><h3 class="card-title">➕ Agregar Canal</h3></div>
              <div class="card-body">
                <input type="hidden" id="channelId">
                <div class="form-group"><label>Nombre del Canal</label><input type="text" id="nombre" class="form-control" placeholder="Ej: TUDN"></div>
                <div class="form-group"><label>URL del Logo</label><input type="text" id="logo" class="form-control" placeholder="https://..."></div>
                <div class="form-group"><label>URL del Stream</label><input type="text" id="url" class="form-control" placeholder="https://..."></div>
                <div class="form-group"><label>Categoría</label>
                  <select id="categoria" class="form-control">
                    <option value="Deportes">⚽ Deportes</option>
                    <option value="Noticias">📰 Noticias</option>
                    <option value="Entretenimiento">📺 Entretenimiento</option>
                    <option value="Musica">🎵 Música</option>
                  </select>
                </div>
                <button onclick="guardarCanal()" class="btn btn-success btn-block"><i class="fas fa-save"></i> Guardar</button>
                <button onclick="limpiarForm()" class="btn btn-secondary btn-block mt-2"><i class="fas fa-times"></i> Limpiar</button>
              </div>
            </div>
          </div>
          <div class="col-md-8">
            <div class="card card-primary">
              <div class="card-header"><h3 class="card-title">Canales Existentes</h3></div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead><tr><th>Logo</th><th>Nombre</th><th>Categoría</th><th>Acciones</th></tr></thead>
                    <tbody id="tablaCanales"><tr><td colspan="4" class="text-center">Cargando...</td></tr></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<script>
  verificarAdmin();

  function cargarCanales() {
    db.collection("canales").onSnapshot((snapshot) => {
      const tbody = document.getElementById('tablaCanales');
      tbody.innerHTML = '';
      if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="4" class="text-center">No hay canales</td></tr>'; return; }
      snapshot.forEach((doc) => {
        const canal = doc.data();
        if (canal.categoria === 'Peliculas') return; // Ignorar películas aquí
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${canal.logo}" width="40" height="40" style="object-fit:contain; background:#000; border-radius:4px;" onerror="this.src='https://via.placeholder.com/40'"></td>
          <td><strong>${canal.nombre}</strong></td>
          <td><span class="badge badge-info">${canal.categoria}</span></td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="borrarCanal('${doc.id}')"><i class="fas fa-trash"></i></button>
          </td>`;
        tbody.appendChild(tr);
      });
    });
  }

  async function guardarCanal() {
    const data = {
      nombre: document.getElementById('nombre').value,
      logo: document.getElementById('logo').value,
      url: document.getElementById('url').value,
      categoria: document.getElementById('categoria').value,
      fecha: new Date(),
      visitas: 0
    };
    if (!data.nombre || !data.url) return Swal.fire('Error', 'Nombre y URL son obligatorios', 'error');
    
    await db.collection("canales").add(data);
    Swal.fire('¡Éxito!', 'Canal guardado', 'success');
    limpiarForm();
  }

  function borrarCanal(id) {
    Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí' }).then((r) => {
      if (r.isConfirmed) db.collection("canales").doc(id).delete();
    });
  }

  function limpiarForm() {
    document.getElementById('nombre').value = '';
    document.getElementById('logo').value = '';
    document.getElementById('url').value = '';
  }

  cargarCanales();
</script>
</body>
</html>
