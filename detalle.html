<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle - NubaraPlay</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #141414; color: #fff; min-height: 100vh; }
        
        .navbar { position: fixed; top: 0; width: 100%; padding: 20px 4%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: #141414; border-bottom: 1px solid #222; }
        .navbar-left { display: flex; align-items: center; gap: 25px; }
        .logo { color: #e50914; font-size: 28px; font-weight: bold; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: #e5e5e5; text-decoration: none; font-size: 14px; }
        .nav-links a:hover { color: #fff; }
        .navbar-right { display: flex; align-items: center; gap: 20px; }
        .user-info { background: #e50914; padding: 5px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .logout-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 7px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        
        .hero { position: relative; height: 60vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 0 4% 40px; }
        .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, #141414 0%, rgba(0,0,0,0.6) 100%); }
        .hero-content { position: relative; z-index: 10; max-width: 600px; display: flex; align-items: center; gap: 20px; }
        .movie-poster { width: 200px; height: 300px; object-fit: cover; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hero-title { font-size: 42px; font-weight: 700; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .hero-meta { display: flex; gap: 15px; margin-top: 10px; font-size: 14px; }
        .hero-meta span { color: #46d369; font-weight: bold; }
        
        .content-section { padding: 20px 4%; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 30px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .info-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        .details { background: #181818; padding: 20px; border-radius: 8px; }
        .details h3 { font-size: 18px; font-weight: 700; margin-bottom: 15px; }
        .detail-item { margin-bottom: 15px; }
        .detail-label { color: #808080; font-size: 14px; margin-bottom: 5px; }
        .detail-value { font-size: 16px; }
        
        .btn-play { background: #e50914; color: #fff; border: none; padding: 15px 40px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; transition: all 0.3s; }
        .btn-play:hover { background: #f40612; transform: scale(1.05); }
        
        .loading { text-align: center; padding: 100px 20px; color: #808080; font-size: 20px; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; margin-bottom: 20px; font-size: 14px; }
        .btn-back:hover { color: #e50914; }

        @media (max-width: 768px) {
            .hero { height: auto; padding: 100px 4% 40px; }
            .hero-content { flex-direction: column; text-align: center; }
            .movie-poster { width: 150px; height: 225px; }
            .hero-title { font-size: 28px; }
            .info-grid { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo">NUBARAPLAY</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="ver-canales.html">Canales TV</a></li>
                <li><a href="genero.html">Películas</a></li>
            </ul>
        </div>
        <div class="navbar-right">
            <span class="user-info" id="userInfo">Usuario</span>
            <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
        </div>
    </nav>

    <div id="loading" class="loading">Cargando película...</div>

    <div id="peliculaContent" style="display: none;">
        <div class="content-section">
            <a href="javascript:history.back()" class="btn-back">← Volver</a>
        </div>

        <div class="hero" id="hero">
            <div class="hero-content">
                <img id="peliculaPoster" src="" alt="Poster" class="movie-poster">
                <div>
                    <h1 class="hero-title" id="peliculaTitulo">Título</h1>
                    <div class="hero-meta">
                        <span id="peliculaAnio">2024</span>
                        <span id="peliculaRating">⭐ 0</span>
                        <span id="peliculaVisitas">👁 0 vistas</span>
                    </div>
                    <button class="btn-play" id="btnReproducir" onclick="reproducirPelicula()">▶ Reproducir</button>
                </div>
            </div>
        </div>

        <div class="content-section">
            <div class="info-grid">
                <div>
                    <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 15px;">Sinopsis</h2>
                    <p id="peliculaSinopsis" style="color: #d2d2d2; line-height: 1.6;"></p>
                </div>
                <div class="details">
                    <h3>Información</h3>
                    <div class="detail-item">
                        <div class="detail-label">Géneros</div>
                        <div class="detail-value" id="detailGeneros">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Año</div>
                        <div class="detail-value" id="detailAnio">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Rating</div>
                        <div class="detail-value" id="detailRating">-</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-section" id="videoSection" style="display: none;">
            <div class="video-wrapper">
                <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",
            authDomain: "nubaraplay.firebaseapp.com",
            projectId: "nubaraplay",
            storageBucket: "nubaraplay.firebasestorage.app",
            messagingSenderId: "873822057409",
            appId: "1:873822057409:web:f854a974f457eedd0c7540"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const params = new URLSearchParams(window.location.search);
        const peliculaId = params.get('id');
        let peliculaActual = null;

        const savedUser = localStorage.getItem('nubaraPlayUser');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            document.getElementById('userInfo').textContent = userData.tipo === 'demo' ? 'DEMO' : 'PREMIUM';
        }

        function cerrarSesion() { localStorage.removeItem('nubaraPlayUser'); localStorage.removeItem('nubaraPlayUserExpiry'); window.location.href = 'index.html'; }

        if (peliculaId) {
            db.collection("peliculas").doc(peliculaId).get().then((doc) => {
                if (doc.exists) {
                    peliculaActual = doc.data();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('peliculaContent').style.display = 'block';

                    document.getElementById('peliculaTitulo').textContent = peliculaActual.nombre;
                    document.getElementById('peliculaAnio').textContent = peliculaActual.anio || 'N/A';
                    document.getElementById('peliculaRating').textContent = '⭐ ' + (peliculaActual.rating || '0');
                    document.getElementById('peliculaVisitas').textContent = ' ' + (peliculaActual.visitas || 0) + ' vistas';
                    document.getElementById('peliculaSinopsis').textContent = peliculaActual.sinopsis || 'Sin sinopsis disponible.';
                    document.getElementById('detailGeneros').textContent = peliculaActual.generos || 'Sin género';
                    document.getElementById('detailAnio').textContent = peliculaActual.anio || 'N/A';
                    document.getElementById('detailRating').textContent = peliculaActual.rating || '0';
                    
                    if (peliculaActual.logo) {
                        document.getElementById('peliculaPoster').src = peliculaActual.logo;
                        document.getElementById('hero').style.backgroundImage = `url('${peliculaActual.logo}')`;
                    }

                    // ✅ REGISTRAR VISUALIZACIÓN DE PELÍCULA
                    const usuario = JSON.parse(localStorage.getItem('nubaraPlayUser') || '{}');
                    db.collection("visualizaciones").add({
                        usuarioId: usuario.id || 'anonimo',
                        usuarioNombre: usuario.nombre || 'Anónimo',
                        tipo: 'pelicula',
                        contenidoId: peliculaId,
                        nombre: peliculaActual.nombre,
                        categoria: peliculaActual.generos || 'Sin género',
                        fecha: new Date()
                    }).catch((err) => console.log("Error registrando visualización:", err));

                    // Sumar visita
                    db.collection("peliculas").doc(peliculaId).update({ visitas: (peliculaActual.visitas || 0) + 1 }).catch(() => {});
                } else {
                    document.getElementById('loading').textContent = 'Película no encontrada';
                }
            }).catch((error) => {
                document.getElementById('loading').textContent = 'Error al cargar la película';
            });
        } else {
            document.getElementById('loading').textContent = 'ID de película no proporcionado';
        }

        function reproducirPelicula() {
            if (peliculaActual && peliculaActual.url) {
                document.getElementById('videoSection').style.display = 'block';
                document.getElementById('playerFrame').src = peliculaActual.url;
                document.getElementById('videoSection').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert('No hay URL de reproducción disponible para esta película');
            }
        }
    </script>
</body>
</html>
